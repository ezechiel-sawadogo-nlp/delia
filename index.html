function lesson(i){
  if(UNITS[i].project)return project(i);
  const u=UNITS[i];d=null;back.style.display='block';back.onclick=parcours;h1.textContent=u.boss?'Boss':u.kicker;dots.innerHTML='';setNav(0);
  const f=u.fiche,steps=[];
  if(u.boss)steps.push({q:u.qs[0]});
  else{const [c1,c2]=splitText(f.comment);
    steps.push({bite:'💡 L\'idée',h:f.idee,t:c1});steps.push({q:u.qs[0]});
    steps.push({bite:'🔍 Exemple',h:'Concrètement',t:'<div class="corpus">'+f.ex+'</div>'+(c2?'<p>'+c2+'</p>':'')});if(u.qs[1])steps.push({q:u.qs[1]});
    steps.push({bite:'🎯 Pourquoi ça compte',h:'Et alors ?',t:f.pourquoi});if(u.qs[2])steps.push({q:u.qs[2]});}
  let k=0,correct=0,total=steps.filter(x=>x.q).length;
  const run=()=>{if(k>=steps.length)return endLesson(i,correct,total);const st=steps[k];
    stage.innerHTML=`<p class="kicker">${u.boss?'👹 Boss':'Leçon '+(i+1)+' — '+u.kicker} <span class="hint">· ${k+1}/${steps.length}</span></p><div class="bar"><i style="width:${Math.round(k/steps.length*100)}%"></i></div>`;
    requestAnimationFrame(()=>{const bi=stage.querySelector('.bar i');if(bi)bi.style.width=Math.round((k+1)/steps.length*100)+'%';});
    const next=document.createElement('button');next.className='btn';next.textContent=k===steps.length-1?'Terminer':'Continuer';next.style.display='none';next.onclick=()=>{k++;run();};
    if(st.bite){stage.innerHTML+=`<p class="lbl">${st.bite}</p><h2>${st.h}</h2><div class="bite">${st.t}</div>`;next.style.display='inline-block';stage.appendChild(next);window.scrollTo(0,0);return;}
    const L=st.q;stage.innerHTML+=`<p class="lbl">✏️ À toi</p><h2>${L.title}</h2><p style="white-space:pre-line">${L.intro}</p>`;
    const fb=document.createElement('div');fb.className='fb';let answered=false;
    const done=(ok,head,body)=>{if(answered)return;answered=true;if(ok){correct++;confetti(20);}fb.className='fb '+(ok?'ok':'ko');fb.innerHTML=`<strong>${head}</strong>${body}`+ficheLink(!ok&&L.kicker!=='Boss'?L.kicker:null);fb.style.display='block';
      stage.querySelectorAll('.opt,.tok').forEach(b=>b.disabled=true);stage.querySelectorAll('.btn').forEach(b=>b!==next&&(b.style.display='none'));next.style.display='inline-block';};
    renderQ(stage,L,(ok,h,b)=>{recordWrong(L,ok);done(ok,h,b);});stage.append(fb,next);window.scrollTo(0,0);};
  run();
}
function splitText(t){const parts=t.split(/(?<=\.)\s+/);const mid=Math.ceil(parts.length/2);return [parts.slice(0,mid).join(' '),parts.slice(mid).join(' ')];}
function endLesson(i,correct,total){
  const willComplete=(function(){const u=UNITS[i];const pass=u.boss?correct>0:true;return pass&&i===P.path&&P.path+1>=UNITS.length;})();
  const u=UNITS[i],perfect=correct===total,pass=u.boss?correct>0:true;
  if(pass&&i===P.path){P.path++;store.set('path',P.path);}
  if(perfect&&!P.pathPerfect.includes(i)){P.pathPerfect.push(i);store.set('pathPerfect',P.pathPerfect);}
  markDay();P.parties++;if(u.boss&&correct>0){P.boss=P.boss||[];if(!P.boss.includes(u.ch))P.boss.push(u.ch);}save();confetti(perfect?70:30);
  const chapDone=u.boss&&pass;
  stage.innerHTML=`<div class="final"><p class="kicker">${u.boss?(pass?'👹 Boss vaincu':'👹 Le boss résiste'):'Leçon terminée'}</p><div class="big">${perfect?'⭐':pass?'✅':'💪'}</div><h2>${perfect?'Sans faute !':pass?correct+' / '+total+' bonnes réponses':'Retente, tu y es presque'}</h2>
  <p class="hint">${u.boss&&pass&&chapDone?`Chapitre « ${DOSSIERS[u.ch].name} » bouclé. Le projet guidé est débloqué.`:u.boss&&!pass?'Relis les leçons du chapitre, la réponse s\'y trouve.':'🔥 Série : '+streak()+' jour'+(streak()>1?'s':'')}</p>
  ${pass&&P.path<UNITS.length?`<button class="btn" onclick="lesson(${P.path})">${UNITS[P.path].boss?'👹 Affronter le boss':UNITS[P.path].project?'🛠️ Lancer le projet':'▶ Leçon suivante'}</button> `:''}${!pass?`<button class="btn" onclick="lesson(${i})">Réessayer</button> `:''}<button class="btn ghost" onclick="parcours()">Voir le parcours</button></div>`;
  if(willComplete){setTimeout(()=>certificate(true),400);}
  if(u.boss&&pass&&chapDone)shareBlock(stage.querySelector('.final'),{title:DOSSIERS[u.ch].name,line1:'Chapitre terminé sur DÉLIA',line2:`${UNITS.filter(x=>x.ch===u.ch).length-1} leçons · boss vaincu`,emoji:ICONS[u.ch],text:`Chapitre « ${DOSSIERS[u.ch].name} » terminé sur DÉLIA ${ICONS[u.ch]}, boss vaincu 👹`});
  setTimeout(checkBadges,600);
}

  let i=0,fixed=0;

    const fb=document.createElement('div');fb.className='fb';const next=document.createElement('button');next.className='btn';next.textContent=i===qs.length-1?'Terminer':'Suivante';next.style.display='none';next.onclick=()=>{i++;run();};let a=false;
    if(L.corpus){const c=document.createElement('div');c.className='corpus';c.textContent=L.corpus;stage.appendChild(c);}

  if(already){fb.className='fb '+(already==='ok'?'ok':'ko');fb.style.display='block';fb.innerHTML=`<strong>${already==='ok'?'Déjà réussie aujourd\'hui ✅':'Déjà tentée aujourd\'hui'}</strong>Reviens demain pour une nouvelle question.`;stage.querySelectorAll('.opt,.tok').forEach(b=>b.disabled=true);go.style.display='inline-block';}
  renderQ(stage,L,(ok,head,body)=>{if(a)return;a=true;recordWrong(L,ok);P.daily[t]=ok?'ok':'ko';store.set('daily',P.daily);markDay();if(ok)confetti(40);save();fb.className='fb '+(ok?'ok':'ko');fb.innerHTML=`<strong>${head}</strong>${body}`+ficheLink(!ok&&L.kicker!=='Boss'?L.kicker:null);fb.style.display='block';stage.querySelectorAll('.opt,.tok').forEach(b=>b.disabled=true);go.style.display='inline-block';setTimeout(checkBadges,400);});

/* ---- Chapitre Python (leçons de code) ---- */
const CSS_PY=1;
const PYFICHES={
"Variables & chaînes":{idee:"Une variable est un nom qui pointe vers une valeur ; une chaîne est du texte entre guillemets.",
 comment:"Le signe <code>=</code> n'est pas l'égalité des maths : c'est une affectation, « range cette valeur sous ce nom ». On lit de droite à gauche : <code>x = 3</code> veut dire « mets 3 dans x ». Un nom de variable est libre (lettres, chiffres, underscore, pas d'espace ni d'accent au début), mais on le choisit parlant : <code>phrase</code> plutôt que <code>p</code>. Une chaîne se met entre guillemets simples ou doubles, au choix, tant qu'on ferme avec le même. Les chaînes sont immuables : une méthode comme <code>.lower()</code> ne modifie pas la chaîne, elle en renvoie une nouvelle. C'est le piège n°1 des débutants.",
 ex:"<div class=\"corpus\"># affectation, pas égalité\nphrase = \"Le Chat DORT\"\n\n# .lower() RENVOIE une copie, ne change pas phrase\nbas = phrase.lower()\nprint(phrase)  # Le Chat DORT (inchangé)\nprint(bas)     # le chat dort\n\n# f-string : insérer une variable dans du texte\nn = 3\nprint(f\"Il y a {n} mots\")  # Il y a 3 mots</div>",
 pieges:["<b>Oublier le résultat de <code>.lower()</code></b> : <code>phrase.lower()</code> seul ne sert à rien, il faut le stocker (<code>phrase = phrase.lower()</code>) ou l'utiliser.","<b>Guillemets non fermés ou mélangés</b> : <code>\"chat'</code> déclenche une <code>SyntaxError</code>.","<b>Mettre des guillemets autour d'un nombre</b> : <code>\"3\"</code> est du texte, pas le nombre 3. <code>\"3\" + \"4\"</code> donne <code>\"34\"</code>, pas 7."],
 pourquoi:"Tout texte à traiter en NLP arrive sous forme de chaîne : la première chose qu'on fait, c'est la nettoyer (minuscules, espaces) avant de la découper."},
"Nombres & calculs":{idee:"Python manipule des entiers (<code>int</code>) et des décimaux (<code>float</code>), et <code>len()</code> mesure une longueur.",
 comment:"Les opérateurs sont <code>+ - * /</code>, plus trois utiles : <code>//</code> (division entière), <code>%</code> (reste, le <i>modulo</i>) et <code>**</code> (puissance). Attention, <code>/</code> renvoie toujours un <code>float</code> : <code>4 / 2</code> vaut <code>2.0</code>, pas <code>2</code>. <code>len()</code> compte les caractères d'une chaîne ou les éléments d'une liste. Pour mélanger texte et nombre dans un <code>print</code>, on convertit avec <code>str()</code>, ou mieux, on utilise une f-string. La conversion inverse, <code>int(\"3\")</code>, transforme du texte en nombre.",
 ex:"<div class=\"corpus\">len(\"chat\")        # 4 caractères\nlen(\"le chat\".split())  # 2 mots\n\n17 // 5   # 3  (division entière)\n17 % 5    # 2  (reste)\n2 ** 10   # 1024 (puissance)\n\n# convertir pour concaténer\nn = 5\nprint(\"j'ai \" + str(n) + \" mots\")  # ok\nprint(f\"j'ai {n} mots\")            # mieux</div>",
 pieges:["<b><code>\"j'ai \" + n</code></b> plante : <code>TypeError</code>, on ne colle pas texte et nombre. Il faut <code>str(n)</code> ou une f-string.","<b>Confondre <code>/</code> et <code>//</code></b> : pour un nombre de mots par ligne, on veut souvent <code>//</code>.","<b><code>len</code> d'un nombre</b> : <code>len(42)</code> est une erreur, <code>len</code> attend une chaîne ou une liste."],
 pourquoi:"Compter des mots, des lettres, des occurrences : le NLP statistique n'est au fond que du comptage bien organisé."},
"Conditions (if / else)":{idee:"<code>if</code>, <code>elif</code>, <code>else</code> font exécuter un bloc selon qu'une condition est vraie ou fausse.",
 comment:"Une condition est une expression qui vaut <code>True</code> ou <code>False</code>. Les comparaisons : <code>==</code> (égal — deux signes !), <code>!=</code> (différent), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. On combine avec <code>and</code>, <code>or</code>, <code>not</code>. Le bloc qui suit le <code>:</code> est <b>indenté de 4 espaces</b> : en Python, l'indentation n'est pas décorative, elle définit ce qui est dans le bloc. <code>elif</code> enchaîne plusieurs cas, <code>else</code> attrape tout le reste. On peut tester l'appartenance avec <code>in</code> : <code>\"chat\" in phrase</code>.",
 ex:"<div class=\"corpus\">mot = \"ordinateur\"\n\nif len(mot) >= 8:\n    print(\"mot long\")\nelif len(mot) >= 4:\n    print(\"mot moyen\")\nelse:\n    print(\"mot court\")\n\n# combiner des conditions\nif mot.isalpha() and len(mot) > 3:\n    print(\"mot valide\")\n\n# appartenance\nif \"ordi\" in mot:\n    print(\"contient ordi\")</div>",
 pieges:["<b>Confondre <code>=</code> et <code>==</code></b> : <code>if x = 3</code> est une erreur ; la comparaison, c'est <code>==</code>.","<b>Oublier les 4 espaces</b> : <code>IndentationError</code>. Et ne jamais mélanger espaces et tabulations.","<b>Oublier les deux-points</b> à la fin de la ligne <code>if …:</code>.","<b>Enchaîner des <code>if</code> au lieu d'<code>elif</code></b> : plusieurs <code>if</code> indépendants peuvent tous se déclencher ; <code>elif</code> garantit qu'un seul cas passe."],
 pourquoi:"Classer, filtrer, décider : « ce mot est-il un mot-outil ? », « cet avis est-il positif ? » — toute règle de traitement passe par des conditions."},
"Boucle for":{idee:"<code>for élément in collection:</code> répète un bloc une fois pour chaque élément.",
 comment:"C'est la boucle la plus courante en Python. Elle marche sur tout ce qui est « itérable » : une liste de mots, les caractères d'une chaîne, les clés d'un dictionnaire. Pour répéter un nombre fixe de fois, on utilise <code>range(n)</code>, qui produit 0, 1, …, n−1. Si on a besoin de l'indice en plus de la valeur, <code>enumerate</code> donne les deux. Le corps de la boucle est indenté ; une variable créée dedans (un accumulateur) doit être initialisée <b>avant</b> la boucle, sinon elle repart de zéro à chaque tour ou n'existe pas.",
 ex:"<div class=\"corpus\">mots = [\"le\", \"chat\", \"dort\"]\n\n# parcourir les éléments\nfor mot in mots:\n    print(mot.upper())\n\n# accumuler : total AVANT la boucle\ntotal = 0\nfor mot in mots:\n    total = total + len(mot)   # ou total += len(mot)\nprint(total)   # 10\n\n# répéter n fois\nfor i in range(3):\n    print(i)   # 0, 1, 2\n\n# indice + valeur\nfor i, mot in enumerate(mots):\n    print(i, mot)</div>",
 pieges:["<b>Initialiser l'accumulateur dans la boucle</b> : mettre <code>total = 0</code> à l'intérieur le remet à zéro à chaque tour.","<b>Croire que <code>range(3)</code> va jusqu'à 3</b> : il s'arrête à 2. <code>range(1, 4)</code> donne 1, 2, 3.","<b>Modifier la liste qu'on parcourt</b> pendant la boucle : source de bugs, on travaille plutôt sur une copie ou une nouvelle liste."],
 pourquoi:"Parcourir chaque mot d'un texte, chaque ligne d'un corpus, chaque document : c'est le geste de base de tout traitement de données."},
"Boucle while":{idee:"<code>while condition:</code> répète tant que la condition reste vraie.",
 comment:"Là où <code>for</code> parcourt une collection connue, <code>while</code> sert quand on ne sait pas d'avance combien de tours il faudra : jusqu'à ce qu'un mot cible apparaisse, jusqu'à convergence d'un calcul, jusqu'à un token de fin. La règle d'or : quelque chose dans le corps doit finir par rendre la condition fausse, sinon la boucle tourne à l'infini (souvent : oublier d'incrémenter le compteur). <code>break</code> sort immédiatement de la boucle, <code>continue</code> saute au tour suivant.",
 ex:"<div class=\"corpus\">i = 1\nwhile i <= 5:\n    print(i)\n    i = i + 1        # sans ça : boucle infinie !\n\n# s'arrêter sur une condition\nmots = [\"le\", \"chat\", \"STOP\", \"dort\"]\nk = 0\nwhile k < len(mots):\n    if mots[k] == \"STOP\":\n        break        # on quitte la boucle\n    print(mots[k])\n    k += 1</div>",
 pieges:["<b>Boucle infinie</b> : oublier de faire évoluer la variable testée. En cas de blocage, il faut recharger la page.","<b>Utiliser <code>while</code> là où <code>for</code> suffit</b> : pour parcourir une liste, <code>for</code> est plus sûr et plus lisible.","<b>Condition testée trop tard</b> : <code>while</code> vérifie AVANT chaque tour ; si elle est fausse dès le départ, le corps ne s'exécute jamais."],
 pourquoi:"La génération de texte d'un modèle est une boucle while : produire un token, l'ajouter, recommencer, jusqu'au token de fin."},
"Listes":{idee:"Une liste est une suite ordonnée et modifiable de valeurs, notée entre crochets.",
 comment:"On accède par indice, qui commence à <b>0</b> : <code>mots[0]</code> est le premier, <code>mots[-1]</code> le dernier. Le découpage (<i>slicing</i>) <code>mots[1:3]</code> renvoie une sous-liste (du 1 inclus au 3 exclu). On ajoute avec <code>.append()</code>, on retire avec <code>.pop()</code> ou <code>.remove()</code>, on mesure avec <code>len()</code>. Contrairement aux chaînes, les listes sont <b>modifiables</b> sur place. Piège avancé mais fréquent : <code>b = a</code> ne copie pas la liste, les deux noms pointent le même objet ; modifier <code>b</code> modifie <code>a</code>. Pour une vraie copie, <code>a.copy()</code> ou <code>a[:]</code>.",
 ex:"<div class=\"corpus\">mots = [\"le\", \"chat\", \"noir\", \"dort\"]\n\nmots[0]     # 'le'   (indices à partir de 0)\nmots[-1]    # 'dort' (dernier)\nmots[1:3]   # ['chat', 'noir']  (1 inclus, 3 exclu)\n\nmots.append(\"vite\")   # ajoute à la fin\nlen(mots)             # 5\n\n# tokenisation = fabriquer une liste\ntokens = \"le chat dort\".split()   # ['le','chat','dort']\n\n# PIÈGE de la copie\na = [1, 2]\nb = a          # même liste !\nb.append(3)\nprint(a)       # [1, 2, 3]  (a a changé aussi)</div>",
 pieges:["<b>Indice hors limites</b> : <code>mots[10]</code> sur une liste de 4 → <code>IndexError</code>.","<b>Croire que l'indice commence à 1</b> : le premier élément est <code>[0]</code>.","<b><code>b = a</code> n'est pas une copie</b> : utilise <code>a.copy()</code> si tu veux modifier l'un sans l'autre.","<b>Confondre <code>.append(x)</code> et <code>+ [x]</code></b> : <code>.append</code> modifie la liste et renvoie <code>None</code> ; <code>ma_liste = ma_liste.append(x)</code> écrase tout par <code>None</code>."],
 pourquoi:"Une phrase tokenisée, un corpus, une séquence de tokens : ce sont des listes. C'est la structure de données reine du NLP."},
"Dictionnaires":{idee:"Un dictionnaire associe des clés uniques à des valeurs, noté entre accolades.",
 comment:"C'est la structure idéale pour compter et pour retrouver une valeur par son nom. On lit <code>d[\"chat\"]</code>, on écrit <code>d[\"chat\"] = 3</code>. Accéder à une clé absente avec <code>d[\"x\"]</code> lève une <code>KeyError</code> ; pour l'éviter, <code>d.get(\"x\", 0)</code> renvoie une valeur par défaut. Le motif de comptage <code>d[mot] = d.get(mot, 0) + 1</code> est à connaître par cœur : c'est un compteur de fréquences. On parcourt avec <code>for cle in d:</code> (les clés) ou <code>for cle, val in d.items():</code> (les deux). Les clés doivent être uniques et immuables (des chaînes, des nombres) ; les valeurs, tout ce qu'on veut.",
 ex:"<div class=\"corpus\">freq = {\"chat\": 2, \"chien\": 1}\n\nfreq[\"chat\"]          # 2\nfreq.get(\"souris\", 0)  # 0 (absente, pas d'erreur)\n# freq[\"souris\"]       # KeyError !\n\n# LE compteur de fréquences\nmots = [\"le\", \"chat\", \"le\"]\nfreq = {}\nfor mot in mots:\n    freq[mot] = freq.get(mot, 0) + 1\nprint(freq)   # {'le': 2, 'chat': 1}\n\n# parcourir clés et valeurs\nfor mot, n in freq.items():\n    print(mot, n)</div>",
 pieges:["<b><code>d[cle]</code> sur une clé absente</b> → <code>KeyError</code>. Réflexe : <code>d.get(cle, defaut)</code>.","<b>Oublier <code>+ 1</code> dans le comptage</b> : <code>d[mot] = d.get(mot, 0)</code> laisse tout à 0.","<b>Clés en double</b> : la seconde écrase la première, un dictionnaire n'a jamais deux fois la même clé.","<b>Croire l'ordre aléatoire</b> : depuis Python 3.7, l'ordre d'insertion est conservé, mais on ne s'appuie pas dessus pour trier — on utilise <code>sorted()</code>."],
 pourquoi:"Fréquences de mots, n-grammes, vocabulaire d'un tokeniseur, table de correspondance mot → indice : le dictionnaire est partout dans un pipeline NLP."},
"Fonctions":{idee:"<code>def nom(paramètres):</code> emballe un bloc de code réutilisable ; <code>return</code> renvoie un résultat.",
 comment:"Une fonction évite de recopier le même code : on l'écrit une fois, on l'appelle autant qu'on veut. Les paramètres sont les entrées, <code>return</code> la sortie. Attention à la différence : <code>return</code> <b>renvoie</b> une valeur qu'on peut stocker ; <code>print</code> <b>affiche</b> seulement, et une fonction sans <code>return</code> renvoie <code>None</code>. Les variables créées dans une fonction sont locales : elles n'existent pas dehors. On peut donner des valeurs par défaut aux paramètres (<code>def f(x, min=3):</code>). Une bonne fonction fait une seule chose et porte un nom qui la décrit.",
 ex:"<div class=\"corpus\">def tokenize(phrase):\n    return phrase.lower().split()\n\ntokens = tokenize(\"Le Chat DORT\")\nprint(tokens)   # ['le', 'chat', 'dort']\n\n# return vs print\ndef carre(x):\n    return x * x        # renvoie -> réutilisable\n\ny = carre(5)            # y = 25\n\ndef affiche(x):\n    print(x * x)        # affiche mais renvoie None\n\nz = affiche(5)          # imprime 25, mais z vaut None\n\n# paramètre par défaut\ndef mots_longs(phrase, mini=4):\n    return [m for m in phrase.split() if len(m) >= mini]</div>",
 pieges:["<b>Confondre <code>return</code> et <code>print</code></b> : sans <code>return</code>, impossible de réutiliser le résultat ; la fonction renvoie <code>None</code>.","<b>Oublier d'appeler la fonction</b> : écrire <code>tokenize</code> sans les parenthèses ne l'exécute pas.","<b>Code après <code>return</code></b> : tout ce qui suit un <code>return</code> exécuté est ignoré.","<b>Vouloir utiliser une variable locale dehors</b> : ce qui est créé dans la fonction n'existe pas à l'extérieur."],
 pourquoi:"Dès qu'un traitement resservira — tokeniser, nettoyer, vectoriser — on en fait une fonction. C'est la base d'un code propre et d'un pipeline réutilisable."},
};

<p class="lbl">Pourquoi ça compte</p><p>${f.pourquoi}</p>`;}

const PYFICHES2={
"f-strings & formatage":{idee:"Une f-string insère des variables et des calculs directement dans une chaîne, entre accolades.",
 comment:"On préfixe la chaîne par <code>f</code>. Tout ce qui est entre <code>{}</code> est évalué : une variable, une expression (<code>{a+b}</code>), un appel de fonction. Après un deux-points dans l'accolade vient le <b>format</b> : <code>.2f</code> pour deux décimales, <code>>10</code> pour aligner à droite sur 10 caractères, <code>,</code> pour séparer les milliers, <code>%</code> pour un pourcentage. C'est la façon moderne (Python 3.6+) ; les anciennes méthodes (<code>%</code> et <code>.format()</code>) existent encore dans du vieux code mais on ne les écrit plus.",
 ex:"<div class=\"corpus\">mot, n = \"chat\", 3\nf\"{mot} : {n} fois\"        # 'chat : 3 fois'\n\nf\"{3.14159:.2f}\"           # '3.14'\nf\"{0.75:.0%}\"              # '75%'\nf\"{1000000:,}\"             # '1,000,000'\n\n# expressions directement\nf\"{n * 2} occurrences\"     # '6 occurrences'\nf\"{mot.upper()}\"           # 'CHAT'</div>",
 pieges:["<b>Oublier le <code>f</code></b> : <code>\"{mot}\"</code> affiche littéralement les accolades, sans remplacer.","<b>Guillemets identiques à l'intérieur</b> : dans une f-string en guillemets doubles, utilise des simples à l'intérieur (<code>f\"{d['chat']}\"</code>).","<b>Confondre <code>.2f</code> (décimales) et <code>2f</code></b> : le point est obligatoire pour le nombre de décimales."],
 pourquoi:"Afficher des fréquences, des scores, des pourcentages proprement dans un rapport ou une sortie de modèle : les f-strings rendent le code lisible."},
"Tuples & ensembles":{idee:"Le tuple est une séquence ordonnée mais immuable ; l'ensemble (set) est une collection non ordonnée de valeurs uniques.",
 comment:"Un <b>tuple</b> <code>(1, 2)</code> ressemble à une liste mais ne peut pas être modifié : pas d'<code>.append</code>, pas de réaffectation d'élément. On s'en sert pour des données fixes (des coordonnées, un couple mot/étiquette) et pour renvoyer plusieurs valeurs d'une fonction. Le <b>dépaquetage</b> <code>a, b = mon_tuple</code> répartit les éléments dans des variables. Un <b>set</b> <code>{1, 2, 3}</code> ne stocke jamais de doublon et n'a pas d'ordre : parfait pour le vocabulaire (mots distincts) et pour les tests d'appartenance (<code>x in mon_set</code>), très rapides. Il supporte les opérations d'ensembles : union <code>|</code>, intersection <code>&</code>, différence <code>-</code>.",
 ex:"<div class=\"corpus\"># tuple : immuable, dépaquetable\ncouple = (\"chat\", \"NOM\")\nmot, tag = couple\n# couple[0] = \"x\"  -> TypeError\n\n# set : uniques, sans ordre\nmots = [\"le\",\"chat\",\"le\",\"chien\"]\nvocab = set(mots)      # {'le','chat','chien'}\nlen(vocab)             # 3 mots distincts\n\n# opérations d'ensembles\na = {\"le\",\"chat\"}\nb = {\"le\",\"chien\"}\na & b                  # {'le'}  (commun)\na | b                  # tous\na - b                  # {'chat'} (dans a pas b)</div>",
 pieges:["<b><code>{}</code> vide est un dictionnaire, pas un set</b> : pour un set vide, écris <code>set()</code>.","<b>Un tuple d'un seul élément</b> s'écrit <code>(x,)</code> avec la virgule ; <code>(x)</code> est juste <code>x</code>.","<b>Le set n'a pas d'ordre</b> : ne compte pas sur l'ordre d'affichage, et on ne peut pas faire <code>set[0]</code>.","<b>Modifier un tuple</b> est impossible : il faut en créer un nouveau."],
 pourquoi:"Le set donne le vocabulaire et les tests d'appartenance instantanés ; le tuple sert aux paires mot/étiquette et aux retours multiples. Deux outils constants en NLP."},
"Compréhensions":{idee:"Une compréhension construit une liste, un dictionnaire ou un set en une seule expression, à la place d'une boucle.",
 comment:"La forme de base : <code>[expr for x in itérable]</code>. On peut filtrer avec <code>if</code> : <code>[m for m in mots if len(m) > 3]</code>. On peut transformer : <code>[m.lower() for m in mots]</code>. La même syntaxe donne un dictionnaire avec des accolades et un deux-points (<code>{m: len(m) for m in mots}</code>) ou un set (<code>{len(m) for m in mots}</code>). C'est plus court et souvent plus rapide qu'une boucle avec <code>.append</code>. La règle : si la compréhension devient illisible (conditions imbriquées, expression longue), il vaut mieux revenir à une vraie boucle.",
 ex:"<div class=\"corpus\">mots = [\"Le\", \"Chat\", \"dort\"]\n\n# transformer\n[m.lower() for m in mots]        # ['le','chat','dort']\n\n# filtrer\n[m for m in mots if len(m) >= 4] # ['Chat','dort']\n\n# les deux à la fois\n[m.lower() for m in mots if m[0].isupper()]\n# ['le','chat']\n\n# dict de compréhension : compteur de longueurs\n{m: len(m) for m in mots}\n# {'Le':2,'Chat':4,'dort':4}\n\n# set de compréhension : longueurs distinctes\n{len(m) for m in mots}           # {2, 4}</div>",
 pieges:["<b>Mettre le <code>if</code> au mauvais endroit</b> : pour filtrer, il va à la fin ; un <code>if/else</code> qui choisit une valeur va avant le <code>for</code> (<code>[a if c else b for x in l]</code>).","<b>Vouloir tout mettre en compréhension</b> : au-delà de deux conditions, une boucle classique est plus claire.","<b>Confondre les délimiteurs</b> : crochets → liste, accolades avec <code>:</code> → dict, accolades sans <code>:</code> → set."],
 pourquoi:"Tokeniser, filtrer les mots-outils, mettre en minuscules, construire un vocabulaire : ces transformations tiennent en une ligne lisible avec les compréhensions."},
"Méthodes de chaînes":{idee:"Les chaînes offrent des méthodes toutes prêtes pour nettoyer, tester et transformer du texte.",
 comment:"Les plus utiles en NLP : <code>.lower()</code>/<code>.upper()</code> (casse), <code>.strip()</code> (enlève espaces et retours à la ligne aux extrémités ; <code>.lstrip()</code>/<code>.rstrip()</code> d'un seul côté), <code>.replace(a, b)</code> (substitution), <code>.split(sep)</code> (découpe), <code>.join(liste)</code> (recolle), <code>.startswith()</code>/<code>.endswith()</code> et <code>.find()</code>/<code>.count()</code> (recherche), <code>.isalpha()</code>/<code>.isdigit()</code> (tests). Comme les chaînes sont immuables, ces méthodes <b>renvoient une nouvelle chaîne</b> sans modifier l'originale. On peut les <b>enchaîner</b> : <code>t.strip().lower().replace(\",\", \"\")</code>.",
 ex:"<div class=\"corpus\">t = \"  Le Chat, DORT.  \"\n\nt.strip()                 # 'Le Chat, DORT.'\nt.lower()                 # '  le chat, dort.  '\nt.replace(\",\", \"\")        # enlève la virgule\n\n# method chaining : nettoyage complet\nt.strip().lower().replace(\",\", \"\").replace(\".\", \"\")\n# 'le chat dort'\n\n# join : l'inverse de split\n\" \".join([\"le\",\"chat\"])    # 'le chat'\n\"-\".join([\"a\",\"b\",\"c\"])    # 'a-b-c'\n\n# tests\n\"chat123\".isalpha()       # False (chiffres)\n\"le chat\".startswith(\"le\") # True</div>",
 pieges:["<b>Croire que la méthode modifie la chaîne</b> : <code>t.strip()</code> seul ne change pas <code>t</code>, il faut <code>t = t.strip()</code>.","<b>Inverser <code>.join()</code></b> : c'est <code>séparateur.join(liste)</code>, donc <code>\" \".join(mots)</code>, jamais <code>mots.join(\" \")</code>.","<b><code>.split()</code> sans argument</b> découpe sur tous les espaces et ignore les espaces multiples — souvent ce qu'on veut ; <code>.split(\" \")</code> est plus rigide.","<b>Enchaîner sur None</b> : si une méthode de liste comme <code>.sort()</code> s'est glissée là, elle renvoie <code>None</code> et casse la chaîne d'appels."],
 pourquoi:"Le prétraitement du texte — minuscules, ponctuation, espaces, découpe — repose entièrement sur ces méthodes. C'est le quotidien du NLP appliqué."},
"Fichiers":{idee:"On lit et écrit des fichiers pour traiter des corpus, avec l'instruction <code>with</code> qui gère la fermeture.",
 comment:"<code>with open(chemin, mode) as f:</code> ouvre le fichier et le referme automatiquement à la sortie du bloc, même en cas d'erreur. Les modes : <code>\"r\"</code> lecture (défaut), <code>\"w\"</code> écriture (écrase), <code>\"a\"</code> ajout. En lecture : <code>f.read()</code> renvoie tout le contenu en une chaîne, <code>f.readlines()</code> la liste des lignes (avec les <code>\\n</code>), ou on itère directement <code>for ligne in f:</code>, plus économe pour un gros fichier. En écriture : <code>f.write(texte)</code> (n'ajoute pas de retour à la ligne tout seul). Pour du texte accentué, préciser <code>encoding=\"utf-8\"</code> évite bien des ennuis, surtout avec les langues à diacritiques.",
 ex:"<div class=\"corpus\"># écrire\nwith open(\"corpus.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"le chat\\n\")\n    f.write(\"le chien\\n\")\n\n# lire tout\nwith open(\"corpus.txt\", encoding=\"utf-8\") as f:\n    texte = f.read()\n\n# lire ligne par ligne (gros fichiers)\nwith open(\"corpus.txt\", encoding=\"utf-8\") as f:\n    for ligne in f:\n        mots = ligne.strip().split()\n        print(mots)</div>",
 pieges:["<b>Oublier <code>with</code></b> : sans lui, le fichier reste ouvert ; <code>with</code> le ferme pour toi.","<b>Le mode <code>\"w\"</code> écrase</b> tout le fichier existant sans prévenir. Pour ajouter, c'est <code>\"a\"</code>.","<b>Oublier <code>\\n</code></b> : <code>f.write</code> ne saute pas de ligne automatiquement, contrairement à <code>print</code>.","<b>Ignorer l'encodage</b> : sans <code>utf-8</code>, les caractères ẹ, ọ, é peuvent casser selon le système."],
 pourquoi:"Un corpus vit dans des fichiers. Savoir les lire ligne par ligne et gérer l'encodage UTF-8 est la première étape de tout projet sur des données réelles, surtout multilingues."},
"Modules":{idee:"Un module regroupe des fonctions prêtes à l'emploi qu'on importe au lieu de les réécrire.",
 comment:"<code>import random</code> charge le module et on appelle <code>random.fonction()</code>. <code>from collections import Counter</code> importe un seul objet, utilisable directement. On peut renommer : <code>import numpy as np</code>. La bibliothèque standard couvre énormément : <code>random</code> (aléatoire), <code>collections</code> (structures avancées dont <code>Counter</code>), <code>math</code>, <code>re</code> (regex), <code>os</code>/<code>pathlib</code> (fichiers), <code>json</code>, <code>datetime</code>. <b>Counter</b> mérite une mention : <code>Counter(liste)</code> compte tout en une ligne et <code>.most_common(n)</code> donne les n plus fréquents — le compteur de fréquences qu'on a codé à la main, offert par la bibliothèque.",
 ex:"<div class=\"corpus\">import random\nrandom.randint(1, 6)        # un dé\nrandom.choice([\"a\",\"b\",\"c\"])  # au hasard\n\nfrom collections import Counter\nmots = [\"le\",\"chat\",\"le\",\"chien\",\"le\"]\nc = Counter(mots)\nc                            # Counter({'le':3,'chat':1,'chien':1})\nc[\"le\"]                      # 3\nc.most_common(2)             # [('le',3),('chat',1)]\n\nimport math\nmath.log(100, 10)            # 2.0  (utile pour l'IDF)</div>",
 pieges:["<b>Nommer son fichier comme un module</b> : un fichier <code>random.py</code> à toi empêche d'importer le vrai <code>random</code>.","<b>Oublier le préfixe</b> : après <code>import random</code>, c'est <code>random.randint</code>, pas <code>randint</code> seul.","<b><code>from module import *</code></b> est déconseillé : il pollue l'espace de noms et masque d'où viennent les fonctions.","<b>Réinventer l'existant</b> : avant d'écrire une fonction, vérifier si la bibliothèque standard la propose déjà."],
 pourquoi:"Compter avec <code>Counter</code>, calculer un logarithme pour l'IDF, tirer un échantillon, manipuler des chemins : les modules évitent de réécrire ce qui existe et fiabilisent le code."},
"Gestion des erreurs":{idee:"<code>try / except</code> rattrape une erreur au lieu de laisser le programme planter.",
 comment:"On met le code risqué dans <code>try:</code> et la réaction dans <code>except TypeErreur:</code>. Les erreurs courantes ont des noms : <code>KeyError</code> (clé de dictionnaire absente), <code>ValueError</code> (conversion impossible, comme <code>int(\"abc\")</code>), <code>IndexError</code> (indice hors liste), <code>FileNotFoundError</code>, <code>ZeroDivisionError</code>. On peut ajouter <code>else</code> (si aucune erreur) et <code>finally</code> (toujours exécuté). La bonne pratique : attraper l'erreur <b>précise</b> qu'on attend, pas un <code>except:</code> nu qui masquerait tous les bugs, y compris ceux qu'on n'avait pas prévus.",
 ex:"<div class=\"corpus\"># clé absente\nfreq = {\"chat\": 2}\ntry:\n    v = freq[\"chien\"]\nexcept KeyError:\n    v = 0            # valeur par défaut\n\n# conversion qui peut échouer\ndef to_int(s):\n    try:\n        return int(s)\n    except ValueError:\n        return None\n\nto_int(\"42\")         # 42\nto_int(\"abc\")        # None (au lieu de planter)\n\n# attraper l'erreur PRÉCISE, pas tout\ntry:\n    x = donnees[i]\nexcept IndexError:\n    x = None</div>",
 pieges:["<b><code>except:</code> nu</b> (sans nom d'erreur) attrape tout, même les vraies bugs : toujours nommer l'exception attendue.","<b>Mettre trop de code dans le <code>try</code></b> : on isole seulement la ligne risquée, pour ne pas masquer d'autres erreurs.","<b>Utiliser <code>try/except</code> comme un <code>if</code></b> : pour une clé de dict, <code>.get(cle, defaut)</code> est souvent plus simple et plus clair.","<b>Oublier que <code>except</code> ne s'exécute que s'il y a erreur</b> : pas d'erreur, pas de bloc except."],
 pourquoi:"Les données réelles sont sales : lignes vides, nombres mal formés, encodages douteux. La gestion d'erreurs permet à un pipeline de traiter un gros corpus sans s'arrêter au premier problème."},
"Le module re (regex)":{idee:"Le module <code>re</code> applique les expressions régulières en Python : chercher, extraire, remplacer des motifs dans du texte.",
 comment:"Les fonctions clés : <code>re.findall(motif, texte)</code> renvoie la liste de toutes les correspondances ; <code>re.sub(motif, remplacement, texte)</code> remplace ; <code>re.search(motif, texte)</code> trouve la première et renvoie un objet <i>match</i> dont <code>.group()</code> donne le texte capturé ; <code>re.match</code> teste le début. On écrit toujours le motif en <b>raw string</b> <code>r\"...\"</code> pour que <code>\\d</code>, <code>\\w</code>, <code>\\s</code> gardent leur sens. Les parenthèses <code>()</code> créent des groupes de capture, récupérables par <code>.group(1)</code>. Pour appliquer le même motif souvent, on le compile : <code>re.compile(...)</code>.",
 ex:"<div class=\"corpus\">import re\n\n# toutes les correspondances\nre.findall(r\"\\d+\", \"3 chats, 12 chiens\")   # ['3','12']\nre.findall(r\"\\w+\", \"le chat\")               # ['le','chat']\n\n# remplacer (normaliser les espaces)\nre.sub(r\"\\s+\", \" \", \"le    chat\")           # 'le chat'\n\n# première correspondance + groupe\nm = re.search(r\"(\\d{4})\", \"publié en 1949\")\nm.group(1)                                   # '1949'\n\n# ATTENTION à l'Unicode\nre.findall(r\"\\w+\", \"ẹ̀kọ́\", re.UNICODE)      # dépend du flag</div>",
 pieges:["<b>Oublier le <code>r</code></b> devant le motif : <code>\"\\d\"</code> peut être mal interprété ; <code>r\"\\d\"</code> est sûr.","<b><code>.group(1)</code> sans parenthèses dans le motif</b> : le groupe 1 n'existe que si tu as mis des <code>()</code>.","<b><code>re.search</code> qui ne trouve rien renvoie <code>None</code></b> : appeler <code>.group()</code> sur <code>None</code> plante, teste avant.","<b><code>\\w</code> et les diacritiques</b> : selon les options, <code>\\w</code> peut ignorer ẹ ou ọ ; c'est le même piège que dans le dossier Ouverture."],
 pourquoi:"Nettoyer des espaces, extraire des dates, des nombres, des entités simples, découper finement : les regex via <code>re</code> sont l'outil de prétraitement le plus utilisé, avant même les modèles."},
};

 {code:1,title:"Complète <code>__init__</code> pour que <code>Mot(\"chat\")</code> ait <code>longueur = 4</code>.",intro:"self.longueur = len(texte)",starter:'class Mot:\n    def __init__(self, texte):\n        self.texte = texte\n        self.longueur = \n\nm = Mot("chat")\nprint(m.longueur)',hint:'self.longueur = len(texte)',test:(g,o)=>g.m&&g.m.longueur===4?[true,'L\'objet se construit tout seul avec sa longueur.']:[false,'longueur doit valoir len(texte) = 4.']}]},
{kicker:'Méthodes',steps:[
 {bite:1,h:"Les actions d'un objet",t:"Une <b>méthode</b> est une fonction définie dans la classe : une action que l'objet sait faire. Elle prend <code>self</code> en premier paramètre pour accéder à ses propres attributs. <code>felix.parle()</code> appelle la méthode <code>parle</code> sur <code>felix</code>."},
 {code:1,title:"Ajoute une méthode <code>crier()</code> qui renvoie le texte du mot en MAJUSCULES.",intro:"return self.texte.upper()",starter:'class Mot:\n    def __init__(self, texte):\n        self.texte = texte\n    def crier(self):\n        \n\nm = Mot("chat")\nprint(m.crier())',hint:'return self.texte.upper()',test:(g,o)=>o==='CHAT'?[true,'La méthode agit sur les attributs de l\'objet.']:[false,'crier() doit renvoyer "CHAT".']}]},
{kicker:'La méthode __str__',steps:[

 {code:1,title:"Fais en sorte que <code>print(Mot(\"chat\"))</code> affiche <code>Mot(chat)</code>.",intro:"return une f-string dans __str__.",starter:'class Mot:\n    def __init__(self, t):\n        self.t = t\n    def __str__(self):\n        \n\nprint(Mot("chat"))',hint:'return f"Mot({self.t})"',test:(g,o)=>o==='Mot(chat)'?[true,'Affichage lisible : Mot(chat).']:[false,'Doit afficher Mot(chat).']}]},
{kicker:'Attributs de classe',steps:[

 {code:1,title:"Complète pour que <code>Compteur.total</code> compte les objets créés (ici 2).",intro:"Dans __init__ : Compteur.total += 1",starter:'class Compteur:\n    total = 0\n    def __init__(self):\n        \n\na = Compteur()\nb = Compteur()\nprint(Compteur.total)',hint:'Compteur.total += 1',test:(g,o)=>o==='2'?[true,'total est partagé : 2 objets créés.']:[false,'total doit valoir 2. Incrémente Compteur.total dans __init__.']}]},
{kicker:'Héritage',steps:[
 {bite:1,h:"Spécialiser une classe",t:"L'<b>héritage</b> permet à une classe d'hériter d'une autre : <code>class Chat(Animal):</code> reprend tout d'<code>Animal</code> et peut ajouter ou <b>redéfinir</b> des méthodes. C'est la réutilisation de code par excellence : un ModèleBERT et un ModèleGPT peuvent hériter d'un Modèle commun."},
 {code:1,title:"<code>Chat</code> hérite d'<code>Animal</code>. Redéfinis <code>parle()</code> pour renvoyer <code>\"miaou\"</code>.",intro:"class Chat(Animal): puis redéfinis parle.",starter:'class Animal:\n    def __init__(self, nom):\n        self.nom = nom\n    def parle(self):\n        return "..."\n\nclass Chat(Animal):\n    def parle(self):\n        \n\nc = Chat("Felix")\nprint(c.nom, c.parle())',hint:'return "miaou"  (et c.nom vient de Animal)',test:(g,o)=>o==='Felix miaou'?[true,'Chat hérite de nom et redéfinit parle.']:[false,'Attendu : Felix miaou. nom vient d\'Animal, parle est redéfini.']},

 {code:1,title:"Dans <code>Chat.__init__</code>, appelle le parent puis ajoute <code>self.couleur</code>.",intro:"super().__init__(nom) puis self.couleur = couleur",starter:'class Animal:\n    def __init__(self, nom):\n        self.nom = nom\n\nclass Chat(Animal):\n    def __init__(self, nom, couleur):\n        \n        self.couleur = couleur\n\nc = Chat("Felix", "noir")\nprint(c.nom, c.couleur)',hint:'super().__init__(nom)',test:(g,o)=>o==='Felix noir'?[true,'super() réutilise le constructeur parent.']:[false,'Attendu : Felix noir. Appelle super().__init__(nom).']}]},
];

 {code:1,title:"1/3 — <code>tokens()</code> renvoie la liste des mots en minuscules.",intro:"return self.texte.lower().split()",starter:'class Tokeniseur:\n    def __init__(self, texte):\n        self.texte = texte\n    def tokens(self):\n        \n\nt = Tokeniseur("Le Chat DORT")\nprint(t.tokens())',hint:'return self.texte.lower().split()',wrap:src=>src+'\n__r__ = Tokeniseur("Le Chat DORT").tokens()',test:(g,o)=>JSON.stringify(g.__r__||null)===JSON.stringify(['le','chat','dort'])?[true,'La méthode tokens marche.']:[false,"Attendu : ['le','chat','dort']."]},

const POOFICHES={
"Classe & objet":{idee:"Une classe est un plan ; un objet (ou instance) est un exemplaire concret fabriqué à partir de ce plan.",
 comment:"On sépare le modèle général (la classe <code>Chat</code>) des cas particuliers (les objets <code>felix</code>, <code>minou</code>). <code>class NomClasse:</code> définit le plan, l'appeler comme une fonction (<code>Chat()</code>) fabrique un objet. Par convention, les noms de classes s'écrivent en <b>CamelCase</b> (première lettre de chaque mot en majuscule). Un objet vide se déclare avec <code>pass</code>. La programmation orientée objet regroupe des <b>données</b> (attributs) et des <b>comportements</b> (méthodes) dans une même entité, au lieu de les éparpiller. En NLP, on modélise ainsi un Document, un Corpus, un Modèle.",
 ex:"<div class=\"corpus\">class Chat:\n    pass\n\nfelix = Chat()      # un objet\nminou = Chat()      # un autre, indépendant\n\ntype(felix).__name__   # 'Chat'\nisinstance(felix, Chat) # True\nfelix is minou          # False (objets distincts)</div>",
 pieges:["<b>Oublier les parenthèses</b> : <code>felix = Chat</code> range la classe elle-même, pas un objet. Il faut <code>Chat()</code>.","<b>Classe vide sans <code>pass</code></b> : un corps de classe ne peut pas être vide, mettre <code>pass</code>.","<b>Confondre classe et objet</b> : la classe est le moule, l'objet le gâteau. Une classe, beaucoup d'objets."],
 pourquoi:"Dès qu'on manipule plusieurs entités du même type — des documents, des phrases, des modèles — une classe évite de dupliquer le code et structure le programme."},
"Attributs":{idee:"Un attribut est une donnée attachée à un objet, accessible par la notation point.",
 comment:"On lit et écrit un attribut avec <code>objet.attribut</code>. Chaque objet a ses propres valeurs : modifier <code>felix.nom</code> ne touche pas <code>minou.nom</code>. On peut ajouter un attribut à tout moment de l'extérieur, mais la bonne pratique est de les installer dans le constructeur <code>__init__</code> (leçon suivante) pour que tout objet naisse complet. Accéder à un attribut inexistant lève une <code>AttributeError</code>.",
 ex:"<div class=\"corpus\">class Mot:\n    pass\n\nm = Mot()\nm.texte = \"chat\"     # on pose un attribut\nm.longueur = 4\n\nm.texte              # 'chat'\nm.longueur           # 4\n\n# propre à chaque objet\nautre = Mot()\nautre.texte = \"chien\"\nm.texte              # toujours 'chat'</div>",
 pieges:["<b>Attribut inexistant</b> : lire <code>m.longueur</code> avant de l'avoir défini → <code>AttributeError</code>.","<b>Croire les objets liés</b> : les attributs d'instance sont indépendants d'un objet à l'autre.","<b>Fautes de frappe silencieuses</b> : <code>m.texte</code> puis <code>m.text</code> crée deux attributs différents sans erreur immédiate."],
 pourquoi:"Les attributs portent l'état d'un objet : le contenu d'un document, la taille d'un vocabulaire, les paramètres d'un modèle. C'est la mémoire de l'objet."},
"Le constructeur __init__":{idee:"<code>__init__</code> est la méthode appelée automatiquement à la création d'un objet, pour installer ses attributs de départ.",
 comment:"Quand on écrit <code>Mot(\"chat\")</code>, Python crée l'objet puis exécute <code>__init__(self, \"chat\")</code>. Le paramètre <code>self</code> — toujours en premier — désigne l'objet en cours de construction ; <code>self.texte = texte</code> range la valeur dans l'objet. Les arguments passés à l'appel (<code>\"chat\"</code>) arrivent après <code>self</code>. On peut donner des valeurs par défaut (<code>def __init__(self, texte=\"\")</code>). <code>__init__</code> ne renvoie rien (pas de <code>return</code> de valeur). C'est l'un des « dunders » (double underscore), méthodes spéciales que Python appelle pour toi.",
 ex:"<div class=\"corpus\">class Mot:\n    def __init__(self, texte):\n        self.texte = texte          # attribut\n        self.longueur = len(texte)  # calculé\n\nm = Mot(\"chat\")   # __init__ s'exécute\nm.texte           # 'chat'\nm.longueur        # 4\n\n# valeur par défaut\nclass Doc:\n    def __init__(self, titre=\"sans titre\"):\n        self.titre = titre\n\nDoc().titre       # 'sans titre'</div>",
 pieges:["<b>Oublier <code>self</code></b> en premier paramètre : erreur classique du débutant.","<b>Oublier <code>self.</code></b> devant l'attribut : <code>texte = texte</code> crée une variable locale perdue à la fin d'__init__.","<b>Mettre un <code>return</code> de valeur</b> dans __init__ : il ne doit rien renvoyer.","<b>Confondre paramètre et attribut</b> : <code>texte</code> est l'entrée, <code>self.texte</code> est ce qui reste dans l'objet."],
 pourquoi:"Le constructeur garantit qu'un objet naît prêt à l'emploi, avec tous ses attributs. C'est là qu'on charge un texte, qu'on initialise un vocabulaire, qu'on fixe des paramètres."},
"Méthodes":{idee:"Une méthode est une fonction définie dans une classe : un comportement que l'objet sait exécuter.",
 comment:"Une méthode se définit comme une fonction, indentée dans la classe, avec <code>self</code> en premier paramètre pour accéder aux attributs de l'objet. On l'appelle avec la notation point : <code>m.crier()</code>. À l'intérieur, <code>self.texte</code> lit l'attribut de <b>cet</b> objet. Une méthode peut renvoyer une valeur (<code>return</code>) ou modifier l'objet (<code>self.longueur = ...</code>). Les méthodes distinguent la POO d'un simple dictionnaire de données : l'objet ne fait pas que stocker, il agit.",
 ex:"<div class=\"corpus\">class Mot:\n    def __init__(self, texte):\n        self.texte = texte\n    def crier(self):\n        return self.texte.upper()\n    def est_long(self, seuil=4):\n        return len(self.texte) >= seuil\n\nm = Mot(\"chat\")\nm.crier()        # 'CHAT'\nm.est_long()     # False (4 >= 4 -> True en fait)\nm.est_long(3)    # True</div>",
 pieges:["<b>Oublier <code>self</code></b> dans la définition : <code>def crier():</code> plante à l'appel.","<b>Oublier les parenthèses à l'appel</b> : <code>m.crier</code> renvoie la méthode, <code>m.crier()</code> l'exécute.","<b>Accéder à l'attribut sans <code>self.</code></b> à l'intérieur : <code>texte</code> seul n'existe pas, c'est <code>self.texte</code>.","<b>Confondre méthode et fonction</b> : une méthode est liée à un objet et reçoit <code>self</code> automatiquement."],
 pourquoi:"Les méthodes encapsulent les traitements au plus près des données : un objet Document sait se tokeniser, un Modèle sait prédire. Le code devient organisé et réutilisable."},
"La méthode __str__":{idee:"<code>__str__</code> définit la représentation textuelle d'un objet, ce que montre <code>print()</code>.",
 comment:"Sans elle, <code>print(objet)</code> affiche quelque chose comme <code>&lt;__main__.Mot object at 0x7f...&gt;</code>, illisible. En définissant <code>__str__(self)</code> qui <b>renvoie une chaîne</b>, on choisit l'affichage. C'est un autre dunder appelé automatiquement par <code>print</code> et <code>str()</code>. Sa cousine <code>__repr__</code> sert à l'affichage technique (dans la console, les listes d'objets) ; par convention <code>__repr__</code> est plus précis et <code>__str__</code> plus lisible. Pour bien faire, on définit au moins l'un des deux.",
 ex:"<div class=\"corpus\">class Mot:\n    def __init__(self, t):\n        self.t = t\n    def __str__(self):\n        return f\"Mot({self.t})\"\n\nprint(Mot(\"chat\"))    # Mot(chat)\nstr(Mot(\"chien\"))     # 'Mot(chien)'\n\n# sans __str__ :\n# <__main__.Mot object at 0x...>  (illisible)</div>",
 pieges:["<b>Ne rien renvoyer</b> : <code>__str__</code> doit faire <code>return</code> d'une chaîne, pas <code>print</code> dedans.","<b>Renvoyer autre chose qu'une chaîne</b> : <code>return self.t</code> si <code>t</code> n'est pas une chaîne lève une erreur.","<b>Confondre <code>__str__</code> et <code>__repr__</code></b> : dans une liste, Python utilise <code>__repr__</code>, pas <code>__str__</code>."],
 pourquoi:"Un bon <code>__str__</code> rend le débogage et les rapports lisibles : afficher un Document, une Entité, un résultat de modèle de façon claire plutôt que comme une adresse mémoire."},
"Attributs de classe":{idee:"Un attribut de classe est partagé par toutes les instances, contrairement à un attribut d'instance propre à chaque objet.",
 comment:"Défini directement dans le corps de la classe (hors <code>__init__</code>), il existe une seule fois pour toute la classe. Tous les objets le voient, et on y accède par <code>NomClasse.attribut</code>. Cas typiques : un compteur d'objets créés, une constante commune, une configuration par défaut. Attention à la nuance : lire l'attribut via une instance fonctionne, mais lui <b>assigner</b> une valeur via l'instance crée un attribut d'instance qui masque celui de la classe. Pour modifier la valeur partagée, on passe par le nom de la classe.",
 ex:"<div class=\"corpus\">class Compteur:\n    total = 0                 # attribut de classe\n    def __init__(self):\n        Compteur.total += 1   # partagé\n\na = Compteur()\nb = Compteur()\nCompteur.total    # 2\n\n# instance vs classe\nclass Config:\n    langue = \"fr\"             # commun à tous\nx = Config()\nx.langue          # 'fr' (lu depuis la classe)</div>",
 pieges:["<b>Modifier via l'instance</b> : <code>a.total = 5</code> crée un attribut d'instance et ne change pas <code>Compteur.total</code>.","<b>Attribut de classe muable partagé</b> : une liste définie au niveau classe est partagée par tous les objets, source de bugs surprenants.","<b>Confondre les deux niveaux</b> : ce qui varie d'un objet à l'autre va dans <code>__init__</code> ; ce qui est commun, dans le corps de la classe."],
 pourquoi:"Compter des instances, partager une configuration ou un vocabulaire commun entre tous les objets d'un même type : l'attribut de classe évite la duplication."},
"Héritage":{idee:"L'héritage permet à une classe fille de reprendre les attributs et méthodes d'une classe mère, et de les spécialiser.",
 comment:"<code>class Chat(Animal):</code> fait hériter <code>Chat</code> de tout <code>Animal</code> : ses attributs, ses méthodes. La fille peut <b>ajouter</b> de nouvelles méthodes et <b>redéfinir</b> (surcharger) celles du parent — c'est le <i>polymorphisme</i> : <code>chat.parle()</code> et <code>chien.parle()</code> répondent différemment. Quand la fille redéfinit <code>__init__</code> mais veut aussi l'initialisation du parent, elle appelle <code>super().__init__(...)</code>. L'héritage modélise une relation « est un » : un Chat <i>est un</i> Animal. On l'utilise pour factoriser ce qui est commun dans une classe de base et ne coder que les différences dans les filles.",
 ex:"<div class=\"corpus\">class Animal:\n    def __init__(self, nom):\n        self.nom = nom\n    def parle(self):\n        return \"...\"\n\nclass Chat(Animal):          # hérite\n    def parle(self):         # redéfinit\n        return \"miaou\"\n\nc = Chat(\"Felix\")\nc.nom            # 'Felix' (hérité d'Animal)\nc.parle()        # 'miaou' (redéfini)\n\n# réutiliser le constructeur parent\nclass Chien(Animal):\n    def __init__(self, nom, race):\n        super().__init__(nom)   # nom via le parent\n        self.race = race</div>",
 pieges:["<b>Oublier <code>super().__init__()</code></b> quand on redéfinit __init__ : les attributs du parent ne sont jamais posés.","<b>Recopier le code du parent</b> au lieu d'appeler <code>super()</code> : duplication inutile.","<b>Abuser de l'héritage</b> : si la relation n'est pas « est un », préférer la composition (un objet qui en contient un autre).","<b>Redéfinir en oubliant <code>self</code></b> ou en changeant la signature attendue."],
 pourquoi:"Un Modèle de base dont héritent un ModèleBERT et un ModèleGPT, une Entité dont héritent Personne, Lieu, Organisation : l'héritage structure un système NLP en factorisant le commun."},
};

function bpeState(corpus){const words={};corpus.toLowerCase().split(/[^a-zà-ÿ]+/).filter(Boolean).forEach(w=>{const k=w.split('').join(' ')+' ▁';words[k]=(words[k]||0)+1;});return words;}

  x.fillStyle='#FFD23F';x.font='800 120px "Baloo 2",Nunito,sans-serif';x.fillText(title,540,700);
  x.fillStyle='#fff';x.font='700 44px Nunito,sans-serif';x.fillText(line1,540,790);x.fillStyle='#B9B0E6';x.font='700 36px Nunito,sans-serif';x.fillText(line2,540,850);
  x.fillStyle='#33E1FF';x.font='700 30px Nunito,sans-serif';x.fillText(location.href.split('#')[0].replace(/^https?:\/\//,'').slice(0,60),540,990);
  return cv;
}
function shareBlock(el,{title,line1,line2,emoji,text}){
  const box=document.createElement('div');box.style.marginTop='14px';
  const b1=document.createElement('button');b1.className='btn ghost';b1.textContent='📣 Partager';
  const b2=document.createElement('button');b2.className='btn ghost';b2.textContent='🖼️ Image';
  const st=document.createElement('p');st.className='hint';st.style.marginTop='8px';
  const url=location.href.split('#')[0],full=text+'\n'+url;
  b1.onclick=async()=>{try{if(navigator.share){await navigator.share({title:'DÉLIA',text:full});st.textContent='Partagé.';}else{await navigator.clipboard.writeText(full);st.textContent='Texte copié, colle-le sur X ou LinkedIn.';}}catch(e){try{await navigator.clipboard.writeText(full);st.textContent='Texte copié.';}catch(e2){st.textContent=full;}}};
  b2.onclick=()=>{const cv=shareCard(title,line1,line2,emoji);cv.toBlob(async blob=>{const f=new File([blob],'decode-moi-ca.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:full});st.textContent='Image partagée.';return;}catch(e){}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='decode-moi-ca.png';a.click();st.textContent='Image téléchargée.';});};
  box.append(b1,document.createTextNode(' '),b2,st);el.appendChild(box);
}
/* ---- Liens directs (mode enseignant) ---- */
const SLUG=['bases','linguistique','nlp','ouverture','afrique','modeles','generation'];
function route(){const h=location.hash.slice(1);if(!h)return false;const [k,v]=h.split('=');
  if(k==='dossier'){const i=SLUG.indexOf(v);if(i>=0){startDossier(i);return true;}}
  if(k==='parcours'){parcours();return true;} if(k==='python'){pythonHome();return true;} if(k==='poo'){pooHome();return true;} if(k==='defi'){chrono();return true;} if(k==='duel'){duel();return true;} if(k==='labo'){labo();return true;} if(k==='badges'){badgesHome();return true;}
  if(k==='fiches'){fichesHome();return true;}
  if(k==='fiche'){for(let i=0;i<DOSSIERS.length;i++){const j=DOSSIERS[i].pool.findIndex(L=>L.kicker.toLowerCase().replace(/[^a-zà-ÿ]/g,'')===decodeURIComponent(v||'').toLowerCase().replace(/[^a-zà-ÿ]/g,''));if(j>=0){fiche(i,j,false);return true;}}}
  return false;}
function prof(){
  d=null;back.style.display='block';h1.textContent='Enseignants';dots.innerHTML='';back.onclick=profil;setNav(4);
  const base=location.href.split('#')[0];
  stage.innerHTML=`<p class="kicker">🎓 Mode enseignant</p><h2>Un lien, une activité</h2><p>Envoie un de ces liens à tes élèves : le jeu s'ouvre directement sur l'activité, sans passer par l'accueil.</p>`;
  const seen=new Set();const items=[['🗺️ Parcours guidé','#parcours'],['🐍 Python pour le NLP','#python'],['🧱 Programmation objet (POO)','#poo'],...DOSSIERS.map((x,i)=>[`${ICONS[i]} Dossier ${x.name}`,`#dossier=${SLUG[i]}`]),['⚡ Défi 60 secondes','#defi'],['⚔️ Duel','#duel'],['🧪 Labo','#labo'],['📚 Toutes les fiches','#fiches']];
  DOSSIERS.forEach(x=>x.pool.forEach(L=>{if(!seen.has(L.kicker)&&L.fiche){seen.add(L.kicker);items.push([`📖 Fiche ${L.kicker}`,'#fiche='+encodeURIComponent(L.kicker)]);}}));
  const st=document.createElement('p');st.className='hint';
  items.forEach(([n,h])=>{const b=document.createElement('button');b.className='dossier';b.style.setProperty('--grad','linear-gradient(135deg,#1E293B,#334155)');b.innerHTML=`<div class="txt"><b style="font-size:16px">${n}</b><span style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${h}</span></div><div class="sc">📋</div>`;
    b.onclick=async()=>{try{await navigator.clipboard.writeText(base+h);st.textContent='Lien copié : '+base+h;}catch(e){st.textContent=base+h;}};stage.appendChild(b);});
  const tip=document.createElement('p');tip.className='hint';tip.innerHTML='Astuce : le jeu est un seul fichier HTML. Hébergé sur GitHub Pages ou Netlify, ces liens marchent partout, et les scores restent sur l\'appareil de chaque élève.';
  stage.append(st,tip);
}

function confetti(n){const cols=['#FFD23F','#FF4D8D','#33E1FF','#7CFF6B','#FF8A3D','#8B5CF6'];for(let k=0;k<n;k++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=cols[k%cols.length];e.style.animationDelay=Math.random()*.4+'s';e.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}}
if(!route()){P.seen?parcours():onboarding();}
window.addEventListener('hashchange',()=>{if(!route())parcours();});
</script>

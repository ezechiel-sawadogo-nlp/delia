<title>DÉLIA — Décodage · Étiquetage · Langues · Intelligence · Analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.45;
    background:radial-gradient(1200px 600px at 10% -10%,#4C1D95 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#BE185D 0%,transparent 55%),radial-gradient(800px 600px at 50% 110%,#0E7490 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed}
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 14s ease-in-out infinite}
  body::before{width:320px;height:320px;background:var(--pink);top:-80px;left:-100px}
  body::after{width:380px;height:380px;background:var(--cyan);bottom:-140px;right:-120px;animation-delay:-7s}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,40px)}}
  .wrap{max-width:520px;margin:0 auto;padding:18px 14px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:52px}
  h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .back{background:rgba(255,255,255,.08);border:0;color:var(--mute);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:6px 12px;border-radius:999px;margin-bottom:6px}
  .dots{display:flex;gap:5px}
  .dots i{width:14px;height:8px;border-radius:999px;background:var(--line);display:block;transition:all .3s}
  .dots i.done{background:var(--lime);box-shadow:0 0 10px var(--lime)}.dots i.miss{background:var(--ko)}.dots i.now{background:var(--sun);width:26px;box-shadow:0 0 12px var(--sun)}
  .card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:26px;padding:24px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .kicker{color:var(--mute);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px}
  h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;margin:0 0 14px}
  p{margin:0 0 12px}
  .sentence{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
  .tok{border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:800;background:rgba(255,255,255,.07);cursor:pointer;font-family:var(--display);color:var(--ink);transition:transform .12s,background .2s,border-color .2s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .tok:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .tok.sel{border-color:var(--sun);background:rgba(255,210,63,.18);box-shadow:0 4px 0 rgba(255,210,63,.35),0 0 18px rgba(255,210,63,.35)}
  .tok.ok{border-color:var(--lime);background:rgba(124,255,107,.18);color:var(--lime);animation:bump .4s}
  .tok.ko{border-color:var(--ko);background:rgba(255,92,122,.18);color:var(--ko);animation:shake .4s}
  .tok small{display:block;font-size:11px;color:var(--mute);margin-top:2px;font-family:var(--body);letter-spacing:.06em}
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
  .opt{border:2px solid var(--line);border-radius:999px;padding:12px 18px;background:rgba(255,255,255,.07);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;transition:transform .12s,background .2s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .opt:active{transform:translateY(3px);box-shadow:none}
  .opt.wide{border-radius:16px;width:100%}
  .opt.sel{border-color:var(--sun);background:rgba(255,210,63,.18)}
  .opt.ok{border-color:var(--lime);background:rgba(124,255,107,.2);color:var(--lime);animation:bump .4s}
  .opt.ko{border-color:var(--ko);background:rgba(255,92,122,.2);color:var(--ko);animation:shake .4s}
  .opt:disabled,.tok:disabled{cursor:default;opacity:.75}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .corpus{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.7;margin:10px 0;white-space:pre-line}
  .btn{display:inline-block;border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:800;font-family:var(--display);background:linear-gradient(90deg,var(--sun),var(--orange));color:#2A1300;cursor:pointer;margin-top:10px;box-shadow:0 6px 0 #B45309,0 10px 24px rgba(255,138,61,.35);transition:transform .12s,box-shadow .12s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #B45309}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35);border:1px solid var(--line)}
  .btn:disabled{opacity:.4;transform:none}
  .fb{margin-top:16px;padding:16px;border-radius:16px;background:rgba(0,0,0,.28);font-size:15px;display:none;animation:pop .35s}
  .fb.ok{border:1px solid rgba(124,255,107,.5);box-shadow:0 0 24px rgba(124,255,107,.2)}.fb.ko{border:1px solid rgba(255,92,122,.5)}
  .fb strong{display:block;margin-bottom:6px;font-family:var(--display);font-size:18px}
  .fb.ok strong{color:var(--lime)}.fb.ko strong{color:var(--ko)}
  code{font-family:ui-monospace,Menlo,monospace;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:6px;font-size:.92em;color:var(--cyan)}
  .final{text-align:center}
  .big{font-family:var(--display);font-size:88px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 4px;background:linear-gradient(180deg,#fff,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 20px rgba(255,210,63,.35))}
  .hint{color:var(--mute);font-size:14px}
  .dossier{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:20px;padding:16px;background:var(--grad,linear-gradient(135deg,var(--violet),var(--pink)));margin:12px 0;cursor:pointer;font-family:inherit;color:#fff;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
  .dossier::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
  .dossier:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .dossier .ico{font-size:34px;margin-right:14px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  .dossier .txt{flex:1}
  .dossier b{display:block;font-family:var(--display);font-size:19px;font-weight:800}
  .dossier span{color:rgba(255,255,255,.85);font-size:13px;font-weight:700}
  .dossier .sc{font-family:var(--display);font-size:20px;font-weight:800;background:rgba(0,0,0,.28);padding:6px 12px;border-radius:999px;min-width:44px;text-align:center}
  .plus a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;margin:8px 0;font-size:15px;font-weight:700;background:rgba(255,255,255,.06)}
  .plus a::after{content:' ↗';color:var(--cyan)}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--sun);font-weight:800;margin:18px 0 6px}
  .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 16px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:999px;transition:width .5s cubic-bezier(.2,1,.3,1)}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FFD23F,#FF8A3D);color:#2A1300;padding:12px 18px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-weight:700;max-width:92vw;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
  .toast b{display:block;font-family:var(--display);font-size:15px}
  @keyframes drop{from{transform:translate(-50%,-80px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .badge{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;opacity:.45}
  .badge.on{opacity:1;border-color:rgba(255,210,63,.6);box-shadow:0 0 18px rgba(255,210,63,.2);background:rgba(255,210,63,.1)}
  .badge .bi{font-size:32px;margin-bottom:4px}
  .badge b{display:block;font-family:var(--display);font-size:13px}
  .badge span{font-size:11px;color:var(--mute);display:block;line-height:1.3}
  .combo{font-family:var(--display);font-weight:800;color:var(--pink);animation:bump .3s}
  .wrap{padding-bottom:96px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,8,58,0),rgba(18,8,58,.95) 30%)}
  .nav div{display:flex;gap:4px;background:rgba(28,18,64,.95);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:520px;width:100%}
  .nav button{flex:1;border:0;background:transparent;color:var(--mute);font-family:var(--display);font-weight:800;font-size:12px;padding:8px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button span{font-size:22px}
  .nav button.on{background:linear-gradient(135deg,rgba(255,210,63,.25),rgba(255,77,141,.25));color:#fff}
  .sec{font-family:var(--display);font-weight:800;font-size:16px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
  .sec span{color:var(--mute);font-size:12px;font-family:var(--body);font-weight:700}
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 12px;margin:0 -4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail .dossier{flex:0 0 230px;scroll-snap-align:start;flex-direction:column;align-items:flex-start;gap:10px;min-height:150px;margin:0}
  .rail .dossier .ico{font-size:38px;margin:0}
  .rail .dossier .sc{position:absolute;top:12px;right:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .dossier{flex-direction:column;align-items:flex-start;gap:8px;margin:0;padding:14px;min-height:120px}
  .grid2 .dossier .ico{font-size:30px;margin:0}
  .grid2 .dossier .sc{display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips .opt{flex:0 0 auto;padding:9px 14px;font-size:14px}
  .stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat b{display:block;font-family:var(--display);font-size:26px;color:var(--sun)}
  .stat span{font-size:12px;color:var(--mute)}
  .hero{text-align:center;padding:6px 0 4px}
  .hero h2{font-size:26px;margin:0 0 4px}
  .path{position:relative;padding-left:8px}
  .path::before{content:"";position:absolute;left:31px;top:0;bottom:0;width:4px;background:var(--line);border-radius:4px}
  .chap{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:15px;background:var(--grad);padding:8px 14px 8px 10px;border-radius:999px;margin:18px 0 6px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .node{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 0;cursor:pointer;font-family:inherit}
  .node .dot{width:50px;height:50px;border-radius:50%;flex:0 0 50px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card2);border:3px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.35)}
  .node.done .dot{background:var(--grad);border-color:transparent}
  .node.now .dot{background:linear-gradient(135deg,var(--sun),var(--orange));border-color:#fff;animation:pulse 1.4s infinite;color:#2A1300}
  .node.lock{opacity:.45;cursor:default}
  .node.boss .dot{border-radius:16px}
  .node .nl b{display:block;font-family:var(--display);font-size:15px}.node .nl span{font-size:12px;color:var(--mute)}
  @keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,210,63,.6)}50%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 14px rgba(255,210,63,0)}}
  .bite{font-size:17px;line-height:1.55}
  .bite .corpus{font-size:16px}
  .conf{position:fixed;top:-10px;width:10px;height:14px;border-radius:3px;z-index:9;animation:fall 1.6s ease-in forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  { kicker:"Tokenisation", fiche:{"idee": "Découper le texte en unités que la machine peut compter : les tokens.", "comment": "Le plus simple est de couper sur les espaces et la ponctuation, mais le français complique tout : « l'école » cache deux mots, « aujourd'hui » un seul, « New York » deux mots pour une seule idée. Les modèles récents utilisent des tokeniseurs en sous-mots (BPE, WordPiece, SentencePiece) qui apprennent, à partir d'un grand corpus, quels morceaux de mots sont fréquents. Un mot rare est alors découpé en fragments connus au lieu d'être ignoré. BPE, en trois gestes : découper tous les mots en lettres, repérer la paire de voisins la plus fréquente dans le corpus, la coller en un symbole, puis répéter des milliers de fois. Le labo permet de le faire pas à pas.", "ex": "« Je n'aime pas ça. » → <code>Je</code> <code>n'</code> <code>aime</code> <code>pas</code> <code>ça</code> <code>.</code> : six tokens pour quatre « mots ». En sous-mots, « incompréhensible » peut devenir <code>in</code> <code>compr</code> <code>éhensible</code>.", "pourquoi": "Un modèle ne lit pas des phrases, il lit des suites de tokens. Une mauvaise tokenisation dégrade tout ce qui vient après, et le choix du tokeniseur explique en partie pourquoi les modèles sont moins bons dans les langues peu représentées.", "plus": [["Wikipédia — Analyse lexicale", "https://fr.wikipedia.org/wiki/Analyse_lexicale"], ["Cours Hugging Face — Les tokenizers", "https://huggingface.co/learn/nlp-course/fr/chapter2/4"], ["Jurafsky & Martin, chap. 2 (en)", "https://web.stanford.edu/~jurafsky/slp3/2.pdf"]]}, title:"Découpe cette phrase comme un tokeniseur",

  { kicker:"Phonologie", fiche:{"idee": "Étudier les sons d'une langue en tant qu'unités distinctives, les phonèmes, indépendamment de l'orthographe.", "comment": "Un phonème est un son qui permet de distinguer deux mots : /p/ et /b/ en français, puisque « pain » et « bain » diffèrent. Chaque langue a son inventaire (environ 36 phonèmes en français, une vingtaine en yoruba plus les tons). La phonétique décrit les sons physiquement, la phonologie décrit comment une langue les organise. L'alphabet phonétique international (API) note chaque son par un symbole unique, quelle que soit la langue.", "ex": "« pain », « pin », « peint » : trois orthographes, un seul son /pɛ̃/. À l'inverse, « fils » (enfant, /fis/) et « fils » (de couture, /fil/) : même orthographe, deux prononciations.", "pourquoi": "Reconnaissance vocale, synthèse de parole, apprentissage des langues : tout ce qui touche à l'oral travaille sur les phonèmes, jamais sur les lettres. C'est aussi essentiel pour les langues à tons comme le yoruba ou le mooré.", "plus": [["Wikipédia — Phonème", "https://fr.wikipedia.org/wiki/Phonème"], ["Wikipédia — Alphabet phonétique international", "https://fr.wikipedia.org/wiki/Alphabet_phonétique_international"]]}, title:"Combien de phonèmes dans « oiseau » ?",

    ko:["C'est 4 : /w a z o/.","<code>oi</code> = /wa/, <code>s</code> = /z/, <code>eau</code> = /o/. L'orthographe française est un mauvais guide pour les sons ; les systèmes vocaux travaillent en API."]},
  { kicker:"Morphologie", fiche:{"idee": "Décomposer un mot en morceaux porteurs de sens : racine, préfixes, suffixes, marques grammaticales.", "comment": "On distingue la morphologie flexionnelle (le même mot sous différentes formes : chante, chantons, chantait) et dérivationnelle (créer de nouveaux mots : chant → chanteur → chanteuse). Les langues varient énormément : le chinois n'a presque pas de morphologie, le finnois ou le swahili empilent des dizaines de formes par mot. Pour une machine, cela se traduit par un vocabulaire explosif à gérer, d'où l'intérêt des tokeniseurs en sous-mots.", "ex": "<code>re</code> + <code>lav</code> + <code>ait</code> = « relavait » : encore, laver, imparfait 3ᵉ personne. Trois informations dans un seul mot. En swahili, « ninakupenda » (je t'aime) contient sujet, temps, objet et racine.", "pourquoi": "Comprendre la morphologie permet de lemmatiser, de reconnaître un mot jamais vu à partir de ses morceaux, et d'adapter les modèles aux langues riches en flexion, majoritaires dans le monde.", "plus": [["Wikipédia — Morphème", "https://fr.wikipedia.org/wiki/Morphème"], ["Wikipédia — Morphologie (linguistique)", "https://fr.wikipedia.org/wiki/Morphologie_(linguistique)"]]}, title:"Combien de morphèmes dans « impossibles » ?",
    intro:"Un morphème est la plus petite unité porteuse de sens ou de fonction grammaticale.",
    options:["2","3","4","5"],answer:"3",
    ok:["3 : im- + possible + -s.","<code>im-</code> est une variante (allomorphe) de <code>in-</code> devant p/b/m ; <code>-s</code> marque le pluriel. Les langues agglutinantes comme le swahili ou le turc empilent bien plus de morphèmes par mot, ce qui complique la tokenisation."],
    ko:["C'est 3 : im- + possible + -s.","<code>im-</code> (négation, variante de <code>in-</code>), <code>possible</code> (racine), <code>-s</code> (pluriel). <code>possible</code> ne se découpe pas davantage en français moderne."]},
  { kicker:"Syntaxe", fiche:{"idee": "Décrire comment les mots se combinent : qui dépend de qui dans la phrase.", "comment": "Deux grandes façons de représenter la structure : les arbres de constituants (la phrase se découpe en groupes emboîtés : groupe nominal, groupe verbal…) et les arbres de dépendances (chaque mot est relié au mot dont il dépend, le verbe principal étant la racine). Le second format domine en NLP parce qu'il est compact et s'adapte à toutes les langues. Un analyseur syntaxique (parser) prédit ces relations ; les meilleurs sont neuronaux et entraînés sur des treebanks.", "ex": "« Le chat de la voisine dort » : <code>dort</code> est la racine, <code>chat</code> en est le sujet, <code>voisine</code> précise <code>chat</code>. Le verbe s'accorde avec « chat », pas avec « voisine », parce que c'est « chat » qui dépend directement de « dort ».", "pourquoi": "Savoir qui fait quoi à qui est la base de la traduction, de l'extraction d'information et de la détection d'ambiguïtés (« j'ai vu un homme avec un télescope »).", "plus": [["Wikipédia — Grammaire de dépendance", "https://fr.wikipedia.org/wiki/Grammaire_de_dépendance"], ["Wikipédia — Analyse syntaxique", "https://fr.wikipedia.org/wiki/Analyse_syntaxique"], ["Jurafsky & Martin, chap. 18 (en)", "https://web.stanford.edu/~jurafsky/slp3/18.pdf"]]}, title:"Touche la tête de la phrase",

    ko:["C'est « mange ».","Le verbe principal est la racine : <code>chat</code> (sujet) et <code>souris</code> (objet) s'y rattachent, et <code>petit</code> se rattache à <code>chat</code>."]},
  { kicker:"Pragmatique", fiche:{"idee": "Étudier ce qu'on veut dire au-delà de ce qu'on dit littéralement.", "comment": "Le philosophe Paul Grice a montré que la conversation repose sur une coopération implicite : on suppose que l'autre dit des choses vraies, pertinentes, ni trop ni trop peu. Quand quelqu'un semble violer ces règles, on cherche un sens caché : c'est l'implicature. La pragmatique couvre aussi les actes de langage (« promettre », « ordonner »), la politesse, l'ironie, et tout ce qui dépend de qui parle à qui, où et quand.", "ex": "« Il fait froid ici » peut vouloir dire « ferme la fenêtre ». « C'est du beau travail » peut être un compliment ou une moquerie selon le ton. « Tu as l'heure ? » n'attend pas « oui ».", "pourquoi": "C'est le point faible historique des machines : le sens dépend du contexte social et de l'intention, pas seulement des mots. Les assistants conversationnels doivent en tenir compte pour ne pas répondre à côté.", "plus": [["Wikipédia — Implicature", "https://fr.wikipedia.org/wiki/Implicature"], ["Wikipédia — Pragmatique (linguistique)", "https://fr.wikipedia.org/wiki/Pragmatique_(linguistique)"]]}, title:"Qu'est-ce qui cloche dans ce dialogue ?",

  { kicker:"TF-IDF", fiche:{"idee": "Mesurer l'importance d'un mot dans un document : fréquent ici, rare ailleurs.", "comment": "TF (term frequency) compte les occurrences du mot dans le document. IDF (inverse document frequency) pénalise les mots présents dans beaucoup de documents : on calcule le logarithme du nombre total de documents divisé par le nombre de documents contenant le mot. Le produit des deux donne un poids élevé aux mots à la fois fréquents localement et rares globalement. Chaque document devient alors un vecteur de poids, comparable aux autres.", "ex": "Dans un article sur le football, « le » apparaît 200 fois mais aussi dans tous les autres articles : poids nul. « corner » apparaît 5 fois et presque nulle part ailleurs : poids élevé.", "pourquoi": "C'est la méthode des moteurs de recherche classiques pour savoir de quoi parle un texte, et elle reste une base de référence solide, rapide et interprétable face aux réseaux de neurones.", "plus": [["Wikipédia — TF-IDF", "https://fr.wikipedia.org/wiki/TF-IDF"], ["Introduction to Information Retrieval (en)", "https://nlp.stanford.edu/IR-book/"]]}, title:"Quel mot a le TF-IDF le plus élevé dans le document 1 ?",
    intro:"TF-IDF favorise les mots fréquents dans un document mais rares dans les autres.",
    corpus:"D1 : le chat noir dort\nD2 : le chien noir court\nD3 : le chat mange",
    options:["le","chat","noir","dort"],answer:"dort",
    ok:["Oui, « dort ».","<code>le</code> est partout (IDF ≈ 0), <code>chat</code> et <code>noir</code> apparaissent dans 2 documents, <code>dort</code> seulement dans D1. C'est le mot le plus discriminant : la base de la recherche d'information classique."],
    ko:["C'est « dort ».","Il n'apparaît que dans D1, donc son IDF est maximal. <code>le</code> est dans les trois documents : TF-IDF proche de zéro."]},
  { kicker:"Similarité cosinus", fiche:{"idee": "Comparer deux textes transformés en vecteurs en mesurant l'angle entre eux : 1 = même direction, 0 = rien en commun.", "comment": "On ne compare pas la longueur des vecteurs (un long document n'est pas « plus » qu'un court), seulement leur orientation. Concrètement : produit scalaire des deux vecteurs divisé par le produit de leurs normes. Ça marche avec des vecteurs de comptes (sac de mots, TF-IDF) comme avec des embeddings. Avec un sac de mots, l'ordre des mots est ignoré ; avec des embeddings de phrases, deux formulations différentes d'une même idée obtiennent un cosinus élevé.", "ex": "« J'aime le riz » et « J'adore le riz » : vecteurs très proches, cosinus élevé. « J'aime le riz » et « La bourse chute » : cosinus proche de 0.", "pourquoi": "C'est ainsi qu'un moteur de recherche, un système de recommandation ou un chatbot avec RAG retrouve les documents pertinents pour une question.", "plus": [["Wikipédia — Similarité cosinus", "https://fr.wikipedia.org/wiki/Similarité_cosinus"], ["Wikipédia — Modèle vectoriel", "https://fr.wikipedia.org/wiki/Modèle_vectoriel"]]}, title:"Quelle paire est la plus similaire en sac de mots ?",
    intro:"En sac de mots, chaque phrase devient un vecteur de comptes. Le cosinus mesure l'angle entre deux vecteurs.",
    options:["« le chat dort » / « le chat mange »","« le chat dort » / « un chien court »","« le chat dort » / « dort le chat »","« le chat dort » / « le chien dort »"],answer:2,wide:true,
    ok:["Cosinus = 1, phrases identiques pour le modèle.","Le sac de mots ignore l'ordre : « dort le chat » a exactement le même vecteur. Forces et faiblesses en une question : rapide, mais aveugle à la syntaxe. Les embeddings contextuels (BERT) corrigent ça."],
    ko:["C'est la troisième paire.","Même mots, même comptes, donc même vecteur : cosinus = 1. Le sac de mots ne voit pas l'ordre. Les autres paires partagent seulement 2 mots sur 3."]},
  { kicker:"Attention", fiche:{"idee": "Permettre à un modèle, pour chaque mot, de « regarder » les autres mots de la phrase et de décider lesquels comptent.", "comment": "Chaque mot produit trois vecteurs : une requête (ce que je cherche), une clé (ce que je propose) et une valeur (ce que je transmets). La requête d'un mot est comparée aux clés de tous les autres ; les scores, normalisés, deviennent des poids d'attention, et le mot reçoit une moyenne pondérée des valeurs. Plusieurs « têtes » d'attention capturent des relations différentes (accord, coréférence, syntaxe). Empilé en couches, c'est le Transformer, publié en 2017 sous le titre « Attention is all you need ».", "ex": "Dans « La clé que j'ai perdue hier était rouge », pour interpréter « rouge », le modèle porte son attention sur « clé », pas sur « hier », malgré la distance.", "pourquoi": "Les modèles précédents (RNN) oubliaient le début d'une phrase longue. L'attention règle ce problème et se calcule en parallèle, ce qui a permis l'entraînement à très grande échelle : BERT, GPT, Claude en sont tous issus.", "plus": [["Wikipédia — Transformeur", "https://fr.wikipedia.org/wiki/Transformeur"], ["The Illustrated Transformer (en)", "https://jalammar.github.io/illustrated-transformer/"], ["Cours Hugging Face — Comment fonctionnent les transformers", "https://huggingface.co/learn/nlp-course/fr/chapter1/4"]]}, title:"Vers quel mot « délicieuse » doit-il porter son attention ?",

    ok:["Oui, « tarte ».","Malgré la distance et le nom <code>Marie</code> intercalé, l'attention relie <code>délicieuse</code> à <code>tarte</code>. C'est exactement ce que les RNN faisaient mal et que le mécanisme d'attention (2017) a résolu."],
    ko:["C'est « tarte ».","<code>Marie</code> est un leurre : c'est la tarte qui est délicieuse. Les poids d'attention permettent de sauter par-dessus la proposition relative."]},

  { kicker:"Expressions régulières", fiche:{"idee": "Décrire un motif de texte avec une mini-syntaxe pour le trouver, l'extraire ou le remplacer.", "comment": "Quelques briques suffisent : <code>\\d</code> un chiffre, <code>\\w</code> un caractère de mot, <code>.</code> n'importe quoi, <code>+</code> un ou plusieurs, <code>*</code> zéro ou plusieurs, <code>{n}</code> exactement n, <code>[abc]</code> un parmi ceux-là, <code>\\b</code> une frontière de mot, les parenthèses pour capturer. Les regex sont puissantes mais vite illisibles ; on les teste sur des exemples et on les commente. Attention à l'Unicode : <code>\\w</code> ne reconnaît pas toujours « é » ou « ọ » selon le langage.", "ex": "<code>\\d{2}:\\d{2}</code> attrape « 14:30 » ou « 09:05 ». <code>[\\w.-]+@[\\w.-]+\\.\\w+</code> attrape la plupart des adresses e-mail.", "pourquoi": "Nettoyage de données, extraction de dates, de prix, de références : les regex sont partout dans un pipeline NLP, souvent avant et après les modèles neuronaux.", "plus": [["Wikipédia — Expression régulière", "https://fr.wikipedia.org/wiki/Expression_régulière"], ["regex101 — testeur interactif (en)", "https://regex101.com/"], ["Jurafsky & Martin, chap. 2 (en)", "https://web.stanford.edu/~jurafsky/slp3/2.pdf"]]}, title:"Quelle regex capture exactement une année à 4 chiffres ?",

    ok:["<code>\\d{4}</code>, exactement.","<code>\\d+</code> prend n'importe quelle suite de chiffres, <code>[0-9]</code> un seul, <code>\\w{4}</code> accepte aussi des lettres. Bonus : ajoute <code>\\b</code> autour pour éviter d'attraper « 20261 »."],

  { kicker:"Langues du monde", fiche:{"idee": "Il existe environ 7 000 langues, groupées en familles, avec des écritures très diverses.", "comment": "Les familles regroupent des langues issues d'un ancêtre commun : indo-européenne (français, hindi, persan), Niger-Congo (yoruba, swahili, mooré, wolof), afro-asiatique (arabe, amharique, haoussa), sino-tibétaine… Les systèmes d'écriture sont un autre axe : alphabets (latin, cyrillique), abjads sans voyelles (arabe), alphasyllabaires (guèze, devanagari), logogrammes (chinois). Pour le NLP, chaque combinaison pose ses problèmes : segmentation sans espaces, diacritiques instables, absence de corpus.", "ex": "Le mooré et le yoruba sont deux langues Niger-Congo mais ne se comprennent pas du tout. L'amharique s'écrit en guèze, l'arabe de droite à gauche, le chinois sans espaces entre les mots. Le yoruba en ligne s'écrit souvent sans ses tons, ce que les modèles apprennent comme norme.", "pourquoi": "Une poignée de langues concentre presque toutes les données numériques. Construire du NLP pour les autres, dont les 2 000 langues africaines, est un des enjeux scientifiques et politiques majeurs du domaine.", "plus": [["Wikipédia — Famille de langues", "https://fr.wikipedia.org/wiki/Famille_de_langues"], ["Wikipédia — Langues en Afrique", "https://fr.wikipedia.org/wiki/Langues_en_Afrique"], ["Masakhane — NLP pour les langues africaines (en)", "https://www.masakhane.io/"]]}, title:"Laquelle n'utilise pas un alphabet dérivé du latin ?",

    options:["swahili","yoruba","amharique","wolof"],answer:"amharique",
    ok:["L'amharique, écrit en guèze.","L'alphasyllabaire guèze (Éthiopie) note consonne + voyelle en un seul signe. Le yoruba, lui, est en latin étendu avec tons et points souscrits (ẹ, ọ, ṣ), ce qui pose ses propres problèmes d'encodage."],
    ko:["C'est l'amharique.","Il s'écrit avec l'alphasyllabaire guèze. Swahili, yoruba et wolof utilisent l'alphabet latin, parfois enrichi de diacritiques."]},
  { kicker:"Normalisation", fiche:{"idee": "Ramener les formes d'un mot à une forme de base pour les regrouper.", "comment": "Le stemming (racinisation) applique des règles mécaniques de suppression de suffixes, comme l'algorithme de Porter ou Snowball : rapide, sans dictionnaire, mais il produit des radicaux qui ne sont pas des mots et confond parfois des mots différents. La lemmatisation cherche le lemme, la forme du dictionnaire, en s'aidant de la catégorie grammaticale : « suis » devient « être » si c'est un verbe, « suivre » si… c'est aussi un verbe, d'où le besoin de contexte. Elle est plus juste mais demande des ressources par langue.", "ex": "Stemming : « chantait », « chanteur », « chants » → <code>chant</code> (on coupe). Lemmatisation : « chantait » → <code>chanter</code>, « chanteur » → <code>chanteur</code>, « chants » → <code>chant</code> (on consulte un dictionnaire).", "pourquoi": "Regrouper les variantes d'un mot améliore la recherche et réduit la taille du vocabulaire. Les grands modèles s'en passent, mais beaucoup de systèmes réels, plus légers, en dépendent encore.", "plus": [["Wikipédia — Lemmatisation", "https://fr.wikipedia.org/wiki/Lemmatisation"], ["Wikipédia — Racinisation", "https://fr.wikipedia.org/wiki/Racinisation"]]}, title:"Pour « chantaient », quel résultat vient d'une lemmatisation ?",
    intro:"Stemming et lemmatisation réduisent tous deux les mots à une forme de base, mais pas de la même façon.",
    options:["chant","chantai","chanter","chantaient"],answer:"chanter",
    ok:["Oui : le lemme, c'est l'infinitif.","Un <em>stemmer</em> coupe bêtement la fin (→ <code>chant</code>, qui n'est même pas un mot ici). Un <em>lemmatiseur</em> utilise un dictionnaire et la catégorie grammaticale pour retrouver la forme canonique."],

is pour toutes un vecteur par forme de mot. BERT (2018) fait passer toute la phrase dans un Transformer : à chaque couche, l'attention mélange l'information des mots voisins, et le vecteur de sortie de « avocat » n'est plus le même dans « l'avocat plaide » et « l'avocat est mûr ». On obtient ces représentations en entraînant le modèle à deviner des mots masqués dans des milliards de phrases. Le même mot a donc autant de vecteurs que d'emplois.", "ex": "Avec word2vec : <code>avocat</code> = un seul point, à mi-chemin entre tribunal et fruit. Avec BERT : « l'avocat plaide » → un point près de <code>juge</code> ; « l'avocat est mûr » → un point près de <code>mangue</code>.", "pourquoi": "C'est le saut de 2018 : les modèles se sont mis à comprendre le contexte. Tout ce qui suit, GPT, Claude, traduction moderne, en dépend.", "plus": [["Wikipédia — BERT (modèle de langage)", "https://fr.wikipedia.org/wiki/BERT_(modèle_de_langage)"], ["The Illustrated BERT (en)", "https://jalammar.github.io/illustrated-bert/"], ["Cours Hugging Face — chapitre 1", "https://huggingface.co/learn/nlp-course/fr/chapter1/1"]]}}, {"kicker": "Embeddings contextuels", "title": "Comment BERT a-t-il appris à produire ces vecteurs sans aucune annotation humaine ?", "intro": "Le texte brut suffit.", "options": ["En lisant des dictionnaires", "En devinant des mots masqués dans des milliards de phrases", "En traduisant vers l'anglais", "Avec des annotateurs payés"], "answer": 1, "ok": ["Exactement.", "On cache 15 % des mots, le modèle doit les retrouver. Pour y arriver, il est obligé d'apprendre grammaire, sens et contexte. Aucune étiquette humaine : c'est de l'auto-supervision."], "ko": ["En devinant des mots masqués.", "La tâche est gratuite : n'importe quel texte fournit ses propres réponses. C'est ce qui a permis d'apprendre sur des corpus immenses."], "wide": true, "fiche": {"idee": "Un vecteur par occurrence, pas par mot : le sens de « avocat » change selon la phrase, son vecteur aussi.", "comment": "Word2vec calcule une fois pour toutes un vecteur par forme de mot. BERT (2018) fait passer toute la phrase dans un Transformer : à chaque couche, l'attention mélange l'information des mots voisins, et le vecteur de sortie de « avocat » n'est plus le même dans « l'avocat plaide » et « l'avocat est mûr ». On obtient ces représentations en entraînant le modèle à deviner des mots masqués dans des milliards de phrases. Le même mot a donc autant de vecteurs que d'emplois.", "ex": "Avec word2vec : <code>avocat</code> = un seul point, à mi-chemin entre tribunal et fruit. Avec BERT : « l'avocat plaide » → un point près de <code>juge</code> ; « l'avocat est mûr » → un point près de <code>mangue</code>.", "pourquoi": "C'est le saut de 2018 : les modèles se sont mis à comprendre le contexte. Tout ce qui suit, GPT, Claude, traduction moderne, en dépend.", "plus": [["Wikipédia — BERT (modèle de langage)", "https://fr.wikipedia.org/wiki/BERT_(modèle_de_langage)"], ["The Illustrated BERT (en)", "https://jalammar.github.io/illustrated-bert/"], ["Cours Hugging Face — chapitre 1", "https://huggingface.co/learn/nlp-course/fr/chapter1/1"]]}}, {"kicker": "Pré-entraînement et fine-tuning", "title": "Tu veux un classifieur d'avis de restaurants en français avec 2 000 exemples. Meilleure approche ?", "intro": "2 000, c'est peu.", "options": ["Entraîner un réseau de zéro sur les 2 000 avis", "Fine-tuner un modèle pré-entraîné (CamemBERT, par exemple) sur les 2 000 avis", "Écrire des règles à la main", "Abandonner, il faut 1 million d'exemples"], "answer": 1, "ok": ["Fine-tuning, oui.", "Le modèle sait déjà le français ; il n'a plus qu'à apprendre ce que « positif » veut dire ici. Quelques minutes d'entraînement suffisent. De zéro, 2 000 exemples ne feraient rien apprendre."], "ko": ["C'est le fine-tuning.", "Un modèle pré-entraîné apporte le savoir général de la langue. Les 2 000 exemples servent juste à l'orienter vers la tâche. C'est le paradigme standard depuis 2018."], "wide": true, "fiche": {"idee": "D'abord apprendre la langue en général sur d'énormes textes, ensuite s'adapter à une tâche précise avec peu de données.", "comment": "Le pré-entraînement ne demande aucune annotation : on cache un mot et le modèle doit le deviner (BERT), ou on lui demande le mot suivant (GPT). Des milliards de phrases suffisent. Le modèle apprend grammaire, faits, style. Ensuite, le fine-tuning : on reprend ce modèle et on l'entraîne quelques heures sur une tâche annotée (classer des avis, repérer des entités, répondre à des questions) avec quelques milliers d'exemples seulement. Le savoir général est réutilisé. Variante moderne : l'instruction tuning, où l'on affine sur des exemples de consignes suivies.", "ex": "Pré-entraînement : lire tout Wikipédia et des millions de pages. Fine-tuning : 2 000 avis de restaurants étiquetés positif/négatif, et le modèle devient un classifieur d'avis meilleur que tout ce qu'on entraînait de zéro.", "pourquoi": "C'est le paradigme dominant depuis 2018. Et il explique l'inégalité entre langues : sans corpus de pré-entraînement, pas de savoir général à réutiliser pour le mooré.", "plus": [["Wikipédia — Apprentissage par transfert", "https://fr.wikipedia.org/wiki/Apprentissage_par_transfert"], ["Cours Hugging Face — Fine-tuner un modèle", "https://huggingface.co/learn/nlp-course/fr/chapter3/1"], ["Jurafsky & Martin, chap. 11 (en)", "https://web.stanford.edu/~jurafsky/slp3/11.pdf"]]}}, {"kicker": "Pré-entraînement et fine-tuning", "title": "Pourquoi le même fine-tuning marche-t-il moins bien en mooré qu'en français ?", "intro": "Pense à l'étape d'avant.", "options": ["Le mooré est plus difficile", "Aucun modèle n'a été sérieusement pré-entraîné sur du mooré : rien à réutiliser", "Le fine-tuning ne marche qu'en français", "Il faut plus de couches"], "answer": 1, "ok": ["Oui.", "Le fine-tuning réutilise ce que le pré-entraînement a appris. Sans corpus mooré au pré-entraînement, le modèle repart presque de zéro. D'où l'importance des modèles multilingues et des corpus africains."], "ko": ["C'est le pré-entraînement qui manque.", "La force du fine-tuning vient du savoir accumulé avant. Pour le mooré, ce savoir n'existe pas ou peu : les 2 000 exemples doivent tout porter."], "wide": true, "fiche": {"idee": "D'abord apprendre la langue en général sur d'énormes textes, ensuite s'adapter à une tâche précise avec peu de données.", "comment": "Le pré-entraînement ne demande aucune annotation : on cache un mot et le modèle doit le deviner (BERT), ou on lui demande le mot suivant (GPT). Des milliards de phrases suffisent. Le modèle apprend grammaire, faits, style. Ensuite, le fine-tuning : on reprend ce modèle et on l'entraîne quelques heures sur une tâche annotée (classer des avis, repérer des entités, répondre à des questions) avec quelques milliers d'exemples seulement. Le savoir général est réutilisé. Variante moderne : l'instruction tuning, où l'on affine sur des exemples de consignes suivies.", "ex": "Pré-entraînement : lire tout Wikipédia et des millions de pages. Fine-tuning : 2 000 avis de restaurants étiquetés positif/négatif, et le modèle devient un classifieur d'avis meilleur que tout ce qu'on entraînait de zéro.", "pourquoi": "C'est le paradigme dominant depuis 2018. Et il explique l'inégalité entre langues : sans corpus de pré-entraînement, pas de savoir général à réutiliser pour le mooré.", "plus": [["Wikipédia — Apprentissage par transfert", "https://fr.wikipedia.org/wiki/Apprentissage_par_transfert"], ["Cours Hugging Face — Fine-tuner un modèle", "https://huggingface.co/learn/nlp-course/fr/chapter3/1"], ["Jurafsky & Martin, chap. 11 (en)", "https://web.stanford.edu/~jurafsky/slp3/11.pdf"]]}}, {"kicker": "LLM", "title": "Qu'ont en commun un modèle de bigrammes de 1990 et GPT ?", "intro": "Reviens à la définition d'un modèle de langue.", "options": ["Rien", "Les deux prédisent le mot suivant ; seuls l'échelle et l'architecture changent", "Les deux utilisent l'attention", "Les deux comprennent le sens"], "answer": 1, "ok": ["Exactement.", "Même objectif : la probabilité du token suivant. Le bigramme regarde un mot en arrière avec des comptes ; le LLM regarde des milliers de tokens avec des milliards de paramètres. La filiation est directe."], "ko": ["Ils prédisent tous deux le mot suivant.", "C'est la définition d'un modèle de langue. Ce qui a changé : le contexte (2 mots → 100 000 tokens), le mécanisme (comptes → attention) et l'échelle des données."], "wide": true, "fiche": {"idee": "Un grand modèle de langue est un Transformer géant entraîné à prédire le token suivant, sur presque tout le texte disponible.", "comment": "La filiation est directe : le n-gramme prédit le mot suivant à partir de deux mots ; le Transformer le prédit à partir de milliers de tokens, avec l'attention pour relier ce qui compte ; le LLM est un Transformer avec des milliards de paramètres et des trillions de tokens d'entraînement. À cette échelle apparaissent des capacités que personne n'a programmées : traduire, résumer, coder, raisonner pas à pas. Le modèle génère ensuite un texte token par token, chaque choix dépendant des précédents. Une phase d'alignement (instructions, préférences humaines) le rend utile en conversation.", "ex": "Donne-lui « La capitale du Burkina Faso est » : il continue par « Ouagadougou », non parce qu'il consulte une base, mais parce que cette suite est de loin la plus probable dans ce qu'il a lu.", "pourquoi": "Comprendre qu'un LLM prédit du texte plausible, et non des faits vérifiés, explique à la fois sa puissance et ses hallucinations.", "plus": [["Wikipédia — Grand modèle de langage", "https://fr.wikipedia.org/wiki/Grand_modèle_de_langage"], ["Jurafsky & Martin, chap. 10 (en)", "https://web.stanford.edu/~jurafsky/slp3/10.pdf"], ["Cours Hugging Face — chapitre 1", "https://huggingface.co/learn/nlp-course/fr/chapter1/1"]]}}, {"kicker": "LLM", "title": "On appelle « capacités émergentes » des choses que le LLM sait faire alors que…", "intro": "Personne ne les a programmées.", "options": ["elles ont été codées à la main", "il n'a été entraîné qu'à prédire le token suivant", "il a été entraîné spécialement pour chacune", "il consulte une base de données"], "answer": 1, "ok": ["Oui.", "Traduire, résumer, coder, raisonner pas à pas : rien de tout ça n'est un objectif d'entraînement. Ça apparaît quand on prédit assez bien assez de texte. C'est encore mal compris."], "ko": ["C'est la deuxième.", "L'objectif est unique et simple : le token suivant. Les compétences apparaissent avec l'échelle, sans avoir été enseignées explicitement."], "wide": true, "fiche": {"idee": "Un grand modèle de langue est un Transformer géant entraîné à prédire le token suivant, sur presque tout le texte disponible.", "comment": "La filiation est directe : le n-gramme prédit le mot suivant à partir de deux mots ; le Transformer le prédit à partir de milliers de tokens, avec l'attention pour relier ce qui compte ; le LLM est un Transformer avec des milliards de paramètres et des trillions de tokens d'entraînement. À cette échelle apparaissent des capacités que personne n'a programmées : traduire, résumer, coder, raisonner pas à pas. Le modèle génère ensuite un texte token par token, chaque choix dépendant des précédents. Une phase d'alignement (instructions, préférences humaines) le rend utile en conversation.", "ex": "Donne-lui « La capitale du Burkina Faso est » : il continue par « Ouagadougou », non parce qu'il consulte une base, mais parce que cette suite est de loin la plus probable dans ce qu'il a lu.", "pourquoi": "Comprendre qu'un LLM prédit du texte plausible, et non des faits vérifiés, explique à la fois sa puissance et ses hallucinations.", "plus": [["Wikipédia — Grand modèle de langage", "https://fr.wikipedia.org/wiki/Grand_modèle_de_langage"], ["Jurafsky & Martin, chap. 10 (en)", "https://web.stanford.edu/~jurafsky/slp3/10.pdf"], ["Cours Hugging Face — chapitre 1", "https://huggingface.co/learn/nlp-course/fr/chapter1/1"]]}}, {"kicker": "Évaluation", "title": "Un détecteur de spam répond toujours « pas spam ». 2 % des mails sont du spam. Son exactitude ?", "intro": "Exactitude = proportion de bonnes réponses.", "options": ["2 %", "50 %", "98 %", "0 %"], "answer": "98 %", "ok": ["98 %, et pourtant il est inutile.", "Il a raison sur les 98 % de mails normaux et tort sur tout le spam. Son rappel sur le spam est de 0 %. C'est pour ça qu'on regarde précision, rappel et F1, pas l'exactitude seule."], "ko": ["98 %.", "Il classe correctement tous les mails normaux. Ce chiffre flatteur cache un rappel nul sur la classe qui compte. L'exactitude ment dès que les classes sont déséquilibrées."], "fiche": {"idee": "Mesurer ce que vaut un système, avec la bonne métrique : le taux de bonnes réponses ne suffit presque jamais.", "comment": "Pour une classification : la précision (parmi ce que j'ai signalé, combien étaient justes ?), le rappel (parmi ce qu'il fallait trouver, combien ai-je trouvé ?) et leur moyenne harmonique, le F1. L'exactitude (accuracy) ment dès que les classes sont déséquilibrées. Pour un modèle de langue : la perplexité, qui mesure à quel point le modèle est surpris par un texte (plus basse = mieux). Pour la traduction ou le résumé : BLEU et ROUGE comparent la sortie à des références humaines par recouvrement de n-grammes, imparfaits mais standards. Toujours évaluer sur des données jamais vues à l'entraînement.", "ex": "Un détecteur de spam qui répond toujours « pas spam » a 98 % d'exactitude si 2 % des mails sont du spam. Son rappel sur le spam : 0 %. Le F1 le démasque immédiatement.", "pourquoi": "Sans métrique adaptée, on ne sait pas si un modèle progresse ni pour qui il échoue. Pour les langues à faibles ressources, construire le jeu d'évaluation est souvent la première contribution utile.", "plus": [["Wikipédia — Précision et rappel", "https://fr.wikipedia.org/wiki/Précision_et_rappel"], ["Wikipédia — BLEU", "https://fr.wikipedia.org/wiki/BLEU_(algorithme)"], ["Wikipédia — Perplexité", "https://fr.wikipedia.org/wiki/Perplexité"]]}}, {"kicker": "Évaluation", "title": "Un système de NER trouve 8 entités sur les 10 du texte, et parmi ses 8, 2 sont fausses. Précision et rappel ?", "intro": "Précision : justes parmi les trouvées. Rappel : trouvées parmi les vraies.", "options": ["Précision 80 %, rappel 60 %", "Précision 75 %, rappel 60 %", "Précision 60 %, rappel 75 %", "Précision 75 %, rappel 80 %"], "answer": 1, "ok": ["Oui : 6/8 et 6/10.", "6 justes sur 8 proposées = 75 % de précision ; 6 trouvées sur 10 attendues = 60 % de rappel. F1 ≈ 67 %. Les deux chiffres racontent des erreurs différentes : trop signaler, ou en rater."], "ko": ["Précision 75 %, rappel 60 %.", "Le système propose 8 entités, dont 6 justes : précision 6/8. Il en fallait 10 : rappel 6/10. On les combine en F1, moyenne harmonique."], "wide": true, "fiche": {"idee": "Mesurer ce que vaut un système, avec la bonne métrique : le taux de bonnes réponses ne suffit presque jamais.", "comment": "Pour une classification : la précision (parmi ce que j'ai signalé, combien étaient justes ?), le rappel (parmi ce qu'il fallait trouver, combien ai-je trouvé ?) et leur moyenne harmonique, le F1. L'exactitude (accuracy) ment dès que les classes sont déséquilibrées. Pour un modèle de langue : la perplexité, qui mesure à quel point le modèle est surpris par un texte (plus basse = mieux). Pour la traduction ou le résumé : BLEU et ROUGE comparent la sortie à des références humaines par recouvrement de n-grammes, imparfaits mais standards. Toujours évaluer sur des données jamais vues à l'entraînement.", "ex": "Un détecteur de spam qui répond toujours « pas spam » a 98 % d'exactitude si 2 % des mails sont du spam. Son rappel sur le spam : 0 %. Le F1 le démasque immédiatement.", "pourquoi": "Sans métrique adaptée, on ne sait pas si un modèle progresse ni pour qui il échoue. Pour les langues à faibles ressources, construire le jeu d'évaluation est souvent la première contribution utile.", "plus": [["Wikipédia — Précision et rappel", "https://fr.wikipedia.org/wiki/Précision_et_rappel"], ["Wikipédia — BLEU", "https://fr.wikipedia.org/wiki/BLEU_(algorithme)"], ["Wikipédia — Perplexité", "https://fr.wikipedia.org/wiki/Perplexité"]]}}, {"kicker": "Transfert cross-lingue", "title": "Tu fine-tunes un modèle multilingue sur de la NER en français, puis tu le testes sur du yoruba jamais annoté. Résultat probable ?", "intro": "Zero-shot cross-lingue.", "options": ["0 %, il ne connaît pas le yoruba", "Un score partiel mais très supérieur à zéro, meilleur si le yoruba a été vu au pré-entraînement", "100 %, les langues sont interchangeables", "Il refuse de répondre"], "answer": 1, "ok": ["Oui.", "Le modèle a appris la tâche en français et transfère une partie de ce savoir grâce aux représentations partagées. Ajouter quelques centaines d'exemples yoruba fait ensuite bondir le score."], "ko": ["Un score partiel.", "Les modèles multilingues alignent en partie les langues entre elles. Le transfert n'est pas parfait, mais il vaut infiniment mieux que de partir de zéro."], "wide": true, "fiche": {"idee": "Utiliser ce qu'un modèle a appris sur des langues riches en données pour aider une langue qui en a peu.", "comment": "Un modèle multilingue (mBERT, XLM-R, AfriBERTa, AfroXLMR) est pré-entraîné sur des dizaines de langues à la fois, avec un vocabulaire de sous-mots partagé. Les langues proches partagent des morceaux de mots et des structures ; le modèle aligne en partie leurs représentations. On peut alors le fine-tuner sur une tâche en français et l'utiliser en bambara avec des résultats bien meilleurs que zéro : c'est le transfert zero-shot cross-lingue. Il marche d'autant mieux que les langues sont apparentées et que la langue cible a été vue un peu au pré-entraînement.", "ex": "Fine-tune un modèle multilingue à reconnaître des entités sur du français annoté ; teste-le sur du yoruba jamais annoté : il retrouve une bonne partie des noms de lieux et de personnes. Ajoute 200 phrases yoruba annotées : le score bondit.", "pourquoi": "C'est la voie la plus réaliste pour équiper les 2 000 langues africaines sans attendre des corpus géants. Des équipes comme Masakhane construisent précisément ces modèles.", "plus": [["Wikipédia — Apprentissage par transfert", "https://fr.wikipedia.org/wiki/Apprentissage_par_transfert"], ["Masakhane (en)", "https://www.masakhane.io/"], ["AfroXLMR sur Hugging Face (en)", "https://huggingface.co/Davlan/afro-xlmr-base"]]}}, {"kicker": "Transfert cross-lingue", "title": "Pour aider le mooré par transfert, quelle langue source est la plus utile ?", "intro": "Cherche la parenté.", "options": ["Le chinois", "Une langue gour voisine, comme le dagara ou le gourmantché", "Le russe", "L'espagnol"], "answer": 1, "ok": ["Oui.", "Le transfert marche d'autant mieux que les langues partagent structures, sous-mots et vocabulaire. Des langues de la même branche, même peu dotées, aident plus qu'une langue lointaine très dotée."], "ko": ["Une langue apparentée.", "Le mooré est une langue gour (Niger-Congo). Ses voisines partagent morphologie et lexique : c'est de là que le transfert est le plus efficace."], "wide": true, "fiche": {"idee": "Utiliser ce qu'un modèle a appris sur des langues riches en données pour aider une langue qui en a peu.", "comment": "Un modèle multilingue (mBERT, XLM-R, AfriBERTa, AfroXLMR) est pré-entraîné sur des dizaines de langues à la fois, avec un vocabulaire de sous-mots partagé. Les langues proches partagent des morceaux de mots et des structures ; le modèle aligne en partie leurs représentations. On peut alors le fine-tuner sur une tâche en français et l'utiliser en bambara avec des résultats bien meilleurs que zéro : c'est le transfert zero-shot cross-lingue. Il marche d'autant mieux que les langues sont apparentées et que la langue cible a été vue un peu au pré-entraînement.", "ex": "Fine-tune un modèle multilingue à reconnaître des entités sur du français annoté ; teste-le sur du yoruba jamais annoté : il retrouve une bonne partie des noms de lieux et de personnes. Ajoute 200 phrases yoruba annotées : le score bondit.", "pourquoi": "C'est la voie la plus réaliste pour équiper les 2 000 langues africaines sans attendre des corpus géants. Des équipes comme Masakhane construisent précisément ces modèles.", "plus": [["Wikipédia — Apprentissage par transfert", "https://fr.wikipedia.org/wiki/Apprentissage_par_transfert"], ["Masakhane (en)", "https://www.masakhane.io/"], ["AfroXLMR sur Hugging Face (en)", "https://huggingface.co/Davlan/afro-xlmr-base"]]}}, {"kicker": "Prompting", "title": "Tu donnes trois avis déjà classés, puis un quatrième à classer. C'est du…", "intro": "Compte les exemples.", "options": ["zero-shot", "few-shot", "fine-tuning", "pré-entraînement"], "answer": "few-shot", "ok": ["Few-shot.", "Quelques exemples dans le prompt, aucun changement des poids. Le modèle imite le format et la logique : apprentissage en contexte. Zero-shot serait la consigne seule."], "ko": ["C'est du few-shot.", "Des exemples résolus dans le prompt, sans entraînement. Contrairement au fine-tuning, le modèle n'est pas modifié ; tout se joue dans la fenêtre de contexte."], "fiche": {"idee": "Plutôt que d'entraîner le modèle, on lui explique la tâche dans le texte qu'on lui envoie.", "comment": "Zero-shot : une consigne seule (« Traduis en dioula : … »). Few-shot : la consigne plus quelques exemples résolus, que le modèle imite. C'est l'apprentissage en contexte (in-context learning) : rien n'est modifié dans les poids du modèle, tout se passe dans la fenêtre de contexte. Des techniques comme la chaîne de pensée (« raisonne étape par étape ») améliorent les tâches complexes. Le prompt devient une forme de programmation en langue naturelle, avec ses bonnes pratiques : être précis, donner le format attendu, fournir des exemples représentatifs.", "ex": "Zero-shot : « Classe cet avis : positif ou négatif. » Few-shot : trois avis déjà classés, puis le quatrième. Le second marche nettement mieux, surtout dans une langue que le modèle connaît mal.", "pourquoi": "Depuis 2022, une grande partie du NLP appliqué se fait sans entraînement du tout. Savoir formuler une tâche est devenu une compétence à part entière.", "plus": [["Wikipédia — Ingénierie de prompt", "https://fr.wikipedia.org/wiki/Ingénierie_de_prompt"], ["Guide de prompting (en)", "https://www.promptingguide.ai/"], ["Documentation Anthropic — prompting (en)", "https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"]]}}, {"kicker": "Prompting", "title": "Le modèle rate un problème de logique. Quelle modification du prompt aide le plus souvent ?", "intro": "Une technique célèbre depuis 2022.", "options": ["Écrire en majuscules", "Lui demander de raisonner étape par étape avant de répondre", "Réduire la question à un mot", "Ajouter « s'il te plaît »"], "answer": 1, "ok": ["La chaîne de pensée.", "Forcer le modèle à écrire les étapes intermédiaires améliore nettement les tâches de raisonnement : chaque étape devient du contexte pour la suivante."], "ko": ["Raisonner étape par étape.", "C'est le chain-of-thought prompting : le modèle génère son raisonnement avant la réponse, et s'appuie dessus. Une des découvertes majeures du prompting."], "wide": true, "fiche": {"idee": "Plutôt que d'entraîner le modèle, on lui explique la tâche dans le texte qu'on lui envoie.", "comment": "Zero-shot : une consigne seule (« Traduis en dioula : … »). Few-shot : la consigne plus quelques exemples résolus, que le modèle imite. C'est l'apprentissage en contexte (in-context learning) : rien n'est modifié dans les poids du modèle, tout se passe dans la fenêtre de contexte. Des techniques comme la chaîne de pensée (« raisonne étape par étape ») améliorent les tâches complexes. Le prompt devient une forme de programmation en langue naturelle, avec ses bonnes pratiques : être précis, donner le format attendu, fournir des exemples représentatifs.", "ex": "Zero-shot : « Classe cet avis : positif ou négatif. » Few-shot : trois avis déjà classés, puis le quatrième. Le second marche nettement mieux, surtout dans une langue que le modèle connaît mal.", "pourquoi": "Depuis 2022, une grande partie du NLP appliqué se fait sans entraînement du tout. Savoir formuler une tâche est devenu une compétence à part entière.", "plus": [["Wikipédia — Ingénierie de prompt", "https://fr.wikipedia.org/wiki/Ingénierie_de_prompt"], ["Guide de prompting (en)", "https://www.promptingguide.ai/"], ["Documentation Anthropic — prompting (en)", "https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"]]}},

{ name:"Génération & fiabilité", boss:{"kicker": "Boss", "title": "Un assistant répond en bambara sur le règlement d'une université. Il invente des dates, coûte cher par message et confond « il » entre deux personnes. Quel plan corrige les trois problèmes ?", "intro": "Trois symptômes, trois notions.", "options": ["Un modèle plus gros", "RAG sur les documents officiels contre les inventions, un tokeniseur mieux adapté au bambara contre la fertilité, un module de coréférence ou un modèle plus contextuel pour les pronoms", "Réécrire le règlement en anglais", "Désactiver les pronoms"], "answer": 1, "ok": ["Boss vaincu !", "Hallucinations → fournir les sources au moment de répondre. Coût → réduire les tokens par mot. Pronoms → résoudre la coréférence. Chaque symptôme a sa réponse technique."], "ko": ["Le boss résiste.", "Les dates inventées appellent le RAG ; le coût vient de la fertilité du tokeniseur ; la confusion des pronoms est un problème de coréférence. Un modèle plus gros n'en règle aucun à coup sûr."], "wide": true, "fiche": null}, sub:"8 indices par partie + boss — RAG, hallucinations, tokens, sens, coréférence, seq2seq", levels:[{"kicker": "RAG", "title": "Dans quel ordre fonctionne un système RAG ?", "intro": "Trois temps, un acronyme.", "options": ["Générer, puis vérifier, puis chercher", "Chercher des passages pertinents, les insérer dans le prompt, générer la réponse", "Entraîner, puis chercher, puis résumer", "Traduire, chercher, générer"], "answer": 1, "ok": ["Retrieve, augment, generate.", "La question devient un vecteur, on retrouve les passages proches (cosinus), on les met dans le prompt, le modèle répond en s'appuyant dessus. Aucun réentraînement."], "ko": ["Chercher, insérer, générer.", "Le modèle ne va pas chercher dans sa mémoire : on lui apporte les documents au moment de répondre. C'est ce qui le rend à jour et vérifiable."], "wide": true, "fiche": {"idee": "Retrouver des documents pertinents, les glisser dans le prompt, puis laisser le modèle répondre en s'appuyant dessus.", "comment": "Trois temps. Retrieve : la question est encodée en vecteur et comparée (cosinus) aux vecteurs des passages d'une base ; on garde les plus proches. Augment : ces passages sont insérés dans le prompt, avec la consigne de s'y appuyer. Generate : le LLM rédige la réponse, idéalement en citant ses sources. Le modèle n'a pas besoin d'avoir appris les faits à l'entraînement : ils lui sont fournis au moment de répondre. Ça permet d'utiliser des données privées, récentes ou dans une langue peu couverte, et de réduire les hallucinations, sans réentraîner.", "ex": "Question : « Quelle est la procédure d'inscription au master TAL ? » Le système retrouve la page du règlement, la met dans le prompt, et le modèle répond avec les dates exactes au lieu d'inventer.", "pourquoi": "C'est aujourd'hui la technique la plus répandue pour rendre un assistant fiable et à jour. Presque tous les chatbots d'entreprise reposent dessus.", "plus": [["Wikipédia — Génération augmentée de récupération", "https://fr.wikipedia.org/wiki/Génération_augmentée_de_récupération"], ["Cours Hugging Face — chapitre 5", "https://huggingface.co/learn/nlp-course/fr/chapter5/1"], ["Article RAG original (en)", "https://arxiv.org/abs/2005.11401"]]}}, {"kicker": "RAG", "title": "Quel avantage principal du RAG par rapport au fine-tuning pour une FAQ d'université qui change chaque semestre ?", "intro": "Pense à la mise à jour.", "options": ["Le RAG est plus rapide à entraîner", "On met à jour les documents, pas le modèle, et les réponses peuvent citer leurs sources", "Le RAG comprend mieux le français", "Il n'y a aucune différence"], "answer": 1, "ok": ["Oui.", "Changer une date dans le règlement suffit. Un modèle fine-tuné devrait être réentraîné, et ne saurait pas dire d'où vient l'information."], "ko": ["C'est la deuxième.", "Le savoir vit dans la base documentaire, modifiable à tout moment, et chaque réponse peut renvoyer au passage utilisé. Le fine-tuning fige les faits dans les poids."], "wide": true, "fiche": {"idee": "Retrouver des documents pertinents, les glisser dans le prompt, puis laisser le modèle répondre en s'appuyant dessus.", "comment": "Trois temps. Retrieve : la question est encodée en vecteur et comparée (cosinus) aux vecteurs des passages d'une base ; on garde les plus proches. Augment : ces passages sont insérés dans le prompt, avec la consigne de s'y appuyer. Generate : le LLM rédige la réponse, idéalement en citant ses sources. Le modèle n'a pas besoin d'avoir appris les faits à l'entraînement : ils lui sont fournis au moment de répondre. Ça permet d'utiliser des données privées, récentes ou dans une langue peu couverte, et de réduire les hallucinations, sans réentraîner.", "ex": "Question : « Quelle est la procédure d'inscription au master TAL ? » Le système retrouve la page du règlement, la met dans le prompt, et le modèle répond avec les dates exactes au lieu d'inventer.", "pourquoi": "C'est aujourd'hui la technique la plus répandue pour rendre un assistant fiable et à jour. Presque tous les chatbots d'entreprise reposent dessus.", "plus": [["Wikipédia — Génération augmentée de récupération", "https://fr.wikipedia.org/wiki/Génération_augmentée_de_récupération"], ["Cours Hugging Face — chapitre 5", "https://huggingface.co/learn/nlp-course/fr/chapter5/1"], ["Article RAG original (en)", "https://arxiv.org/abs/2005.11401"]]}}, {"kicker": "Hallucinations", "title": "Tu demandes à un LLM un proverbe mooré avec sa traduction. La réponse est fluide et bien formée. Que dois-tu conclure ?", "intro": "Le modèle a lu très peu de mooré.", "options": ["Le proverbe est authentique", "Rien : la fluidité ne prouve pas l'authenticité, il peut être inventé", "Le modèle parle mooré couramment", "Le proverbe est forcément faux"], "answer": 1, "ok": ["Exactement.", "Un LLM produit du texte plausible, pas du texte vérifié. Sur une langue rare, il fabrique ce qui ressemble à un proverbe. Il faut vérifier auprès d'un locuteur ou d'une source."], "ko": ["La fluidité ne prouve rien.", "Le modèle génère la suite la plus probable ; sur le mooré, il n'a presque rien vu et invente avec assurance. Ni vrai ni faux par défaut : à vérifier."], "wide": true, "fiche": {"idee": "Le modèle produit une affirmation fausse, souvent précise et confiante, parce qu'elle est plausible.", "comment": "Un LLM génère le texte le plus probable, pas le plus vrai. Quand il manque d'information (fait rare, langue peu vue, question sur un événement récent), il comble avec ce qui ressemble à une bonne réponse : une date crédible, une référence bibliographique qui a la bonne forme, un proverbe qui sonne juste. Rien dans le mécanisme ne distingue souvenir et invention. On limite le phénomène par le RAG, par des instructions demandant d'exprimer l'incertitude, par la vérification automatique, et par l'alignement qui entraîne le modèle à dire « je ne sais pas ».", "ex": "Demande-lui un proverbe mooré avec sa traduction : la réponse peut être fluide, bien formée, et totalement inventée. Le modèle a très peu lu de mooré et fabrique ce qui ressemble à un proverbe.", "pourquoi": "Plus la langue ou le sujet est rare, plus le risque est grand. Vérifier les sorties dans les langues à faibles ressources n'est pas optionnel.", "plus": [["Wikipédia — Hallucination (intelligence artificielle)", "https://fr.wikipedia.org/wiki/Hallucination_(intelligence_artificielle)"], ["Jurafsky & Martin, chap. 10 (en)", "https://web.stanford.edu/~jurafsky/slp3/10.pdf"]]}}, {"kicker": "Hallucinations", "title": "Pourquoi un LLM invente-t-il des références bibliographiques qui n'existent pas ?", "intro": "Regarde la forme d'une référence.", "options": ["Il veut tromper", "Il génère la suite la plus probable, et une référence plausible a la bonne forme même sans exister", "Sa base de données est corrompue", "Il confond deux langues"], "answer": 1, "ok": ["Oui.", "Auteur, année, titre, revue : le modèle a vu des millions de références et sait à quoi elles ressemblent. Il en assemble une crédible. Rien ne distingue, en lui, souvenir et fabrication."], "ko": ["C'est la deuxième.", "Le modèle n'a pas de base de données : il prédit du texte. Une référence inventée est simplement une suite de tokens très probable. RAG et vérification servent à contrer ça."], "wide": true, "fiche": {"idee": "Le modèle produit une affirmation fausse, souvent précise et confiante, parce qu'elle est plausible.", "comment": "Un LLM génère le texte le plus probable, pas le plus vrai. Quand il manque d'information (fait rare, langue peu vue, question sur un événement récent), il comble avec ce qui ressemble à une bonne réponse : une date crédible, une référence bibliographique qui a la bonne forme, un proverbe qui sonne juste. Rien dans le mécanisme ne distingue souvenir et invention. On limite le phénomène par le RAG, par des instructions demandant d'exprimer l'incertitude, par la vérification automatique, et par l'alignement qui entraîne le modèle à dire « je ne sais pas ».", "ex": "Demande-lui un proverbe mooré avec sa traduction : la réponse peut être fluide, bien formée, et totalement inventée. Le modèle a très peu lu de mooré et fabrique ce qui ressemble à un proverbe.", "pourquoi": "Plus la langue ou le sujet est rare, plus le risque est grand. Vérifier les sorties dans les langues à faibles ressources n'est pas optionnel.", "plus": [["Wikipédia — Hallucination (intelligence artificielle)", "https://fr.wikipedia.org/wiki/Hallucination_(intelligence_artificielle)"], ["Jurafsky & Martin, chap. 10 (en)", "https://web.stanford.edu/~jurafsky/slp3/10.pdf"]]}}, {"kicker": "Fertilité des tokens", "title": "« Bonjour » fait 1 ou 2 tokens. « Báwo ni » (yoruba) peut en faire 8. Pourquoi ?", "intro": "Pense à ce que le tokeniseur a vu à l'entraînement.", "options": ["Le yoruba est plus long", "Le tokeniseur a été appris sur des corpus dominés par l'anglais ; les lettres accentuées sont découpées en octets", "Le yoruba n'a pas de mots", "C'est un bug"], "answer": 1, "ok": ["Oui.", "Le vocabulaire de sous-mots reflète les langues d'entraînement. Un « á » rare devient plusieurs tokens d'octets. Résultat : plus cher, contexte plus court, modèle moins bon."], "ko": ["C'est la deuxième.", "Les sous-mots fréquents en anglais font un token ; les caractères rares sont éclatés. La fertilité (tokens par mot) du yoruba est plusieurs fois celle de l'anglais."], "wide": true, "fiche": {"idee": "Le nombre de tokens qu'il faut pour écrire un même texte varie énormément selon la langue, et ça coûte cher.", "comment": "Les tokeniseurs sont appris sur des corpus dominés par l'anglais. Un mot anglais courant fait un token ; un mot yoruba avec ses diacritiques, ou un mot amharique en guèze, peut en faire cinq ou dix, parfois un par octet. On appelle fertilité le nombre moyen de tokens par mot. Conséquences : le même message coûte plus cher (facturation au token), tient moins dans la fenêtre de contexte, et le modèle, qui voit la langue en miettes, la comprend et la génère moins bien. Des tokeniseurs équilibrés entre langues réduisent l'écart.", "ex": "« Bonjour, comment ça va ? » : 7 tokens environ. Sa traduction yoruba « Báwo ni, ṣé o wà dáadáa ? » : souvent 20 à 30 tokens avec un tokeniseur standard, parce que chaque lettre accentuée est découpée en octets.", "pourquoi": "C'est une inégalité invisible mais mesurable : pour un même service, un locuteur de langue africaine paie plus et obtient moins. C'est un sujet de recherche actif.", "plus": [["Wikipédia — Analyse lexicale", "https://fr.wikipedia.org/wiki/Analyse_lexicale"], ["Cours Hugging Face — Les tokenizers", "https://huggingface.co/learn/nlp-course/fr/chapter2/4"], ["Tokenizer playground OpenAI (en)", "https://platform.openai.com/tokenizer"]]}}, {"kicker": "Fertilité des tokens", "title": "Une fertilité élevée pour une langue implique…", "intro": "Trois conséquences pour le même texte.", "options": ["Un coût plus élevé, moins de texte dans la fenêtre de contexte, une compréhension dégradée", "Une meilleure précision", "Aucune conséquence pratique", "Une génération plus rapide"], "answer": 0, "ok": ["Les trois, oui.", "Facturé au token, le même message coûte plus ; la fenêtre se remplit plus vite ; et le modèle voit la langue en miettes. Une inégalité mesurable entre langues."], "ko": ["C'est la première.", "Plus de tokens pour dire la même chose : on paie plus, on peut en dire moins, et le modèle comprend moins bien. Des tokeniseurs plus équilibrés sont un sujet de recherche."], "wide": true, "fiche": {"idee": "Le nombre de tokens qu'il faut pour écrire un même texte varie énormément selon la langue, et ça coûte cher.", "comment": "Les tokeniseurs sont appris sur des corpus dominés par l'anglais. Un mot anglais courant fait un token ; un mot yoruba avec ses diacritiques, ou un mot amharique en guèze, peut en faire cinq ou dix, parfois un par octet. On appelle fertilité le nombre moyen de tokens par mot. Conséquences : le même message coûte plus cher (facturation au token), tient moins dans la fenêtre de contexte, et le modèle, qui voit la langue en miettes, la comprend et la génère moins bien. Des tokeniseurs équilibrés entre langues réduisent l'écart.", "ex": "« Bonjour, comment ça va ? » : 7 tokens environ. Sa traduction yoruba « Báwo ni, ṣé o wà dáadáa ? » : souvent 20 à 30 tokens avec un tokeniseur standard, parce que chaque lettre accentuée est découpée en octets.", "pourquoi": "C'est une inégalité invisible mais mesurable : pour un même service, un locuteur de langue africaine paie plus et obtient moins. C'est un sujet de recherche actif.", "plus": [["Wikipédia — Analyse lexicale", "https://fr.wikipedia.org/wiki/Analyse_lexicale"], ["Cours Hugging Face — Les tokenizers", "https://huggingface.co/learn/nlp-course/fr/chapter2/4"], ["Tokenizer playground OpenAI (en)", "https://platform.openai.com/tokenizer"]]}}, {"kicker": "Désambiguïsation du sens", "title": "« La souris est cassée. » Quels mots permettent de choisir le bon sens de « souris » ?", "intro": "Le contexte lexical.", "options": ["Aucun, c'est ambigu", "« cassée » : un animal ne se casse pas, un périphérique oui", "« La » indique le périphérique", "La longueur de la phrase"], "answer": 1, "ok": ["Oui.", "Le sens se lit dans les voisins : « cassée » va avec l'objet. La méthode de Lesk compare les mots de la phrase aux définitions ; les embeddings contextuels font ce calcul implicitement."], "ko": ["C'est « cassée ».", "La désambiguïsation lexicale s'appuie sur les mots autour : ici, « cassée » exclut l'animal. Avec « cachée sous le meuble », on choisirait l'animal."], "wide": true, "fiche": {"idee": "Choisir, parmi les sens possibles d'un mot, celui qui est en jeu dans la phrase.", "comment": "Beaucoup de mots ont plusieurs sens (« avocat », « souris », « voler ») et beaucoup de formes en cachent plusieurs (« oko » en yoruba sans tons). La désambiguïsation lexicale (WSD) attribue à chaque occurrence un sens d'un inventaire, comme WordNet ou un dictionnaire. Approches : règles et contexte lexical (méthode de Lesk : le sens dont la définition partage le plus de mots avec la phrase), puis apprentissage supervisé, puis embeddings contextuels, qui résolvent le problème presque en passant, puisque leur vecteur encode déjà le sens en contexte. La restauration des tons en yoruba est une WSD déguisée.", "ex": "« La souris est cassée » à côté d'un clavier : périphérique. « La souris est cachée » sous un meuble : animal. Les mots voisins tranchent : clavier, cassée / cachée, meuble.", "pourquoi": "Traduction, recherche, résumé : toute tâche qui touche au sens en dépend. Et c'est le prolongement naturel des tons et des homographes.", "plus": [["Wikipédia — Désambiguïsation lexicale", "https://fr.wikipedia.org/wiki/Désambiguïsation_lexicale"], ["Wikipédia — WordNet", "https://fr.wikipedia.org/wiki/WordNet"]]}}, {"kicker": "Désambiguïsation du sens", "title": "Restaurer les tons de « oko » en yoruba (mari, houe, lance, pirogue) est le même problè  capitaine » ?", "intro": "Regroupe les mentions.", "options": ["Trois", "Deux", "Une seule", "Aucune"], "answer": "Une seule", "ok": ["Une seule, trois mentions.", "Nom propre, pronom, reprise nominale : trois façons de désigner la même personne. Résoudre la coréférence, c'est les regrouper. Sans ça, « est devenu président » n'a pas de sujet identifié."], "ko": ["Une seule entité.", "« Il » et « Le capitaine » renvoient tous deux à Sankara. La coréférence relie les mentions ; c'est indispensable pour extraire des faits ou résumer."], "fiche": {"idee": "Retrouver que « il », « ce dernier », « le capitaine » et « Thomas Sankara » désignent la même personne dans un texte.", "comment": "Un texte réutilise rarement le nom complet : il enchaîne pronoms, reprises nominales, ellipses. Résoudre la coréférence, c'est regrouper toutes les mentions qui renvoient à la même entité. Indices : genre et nombre, distance, rôle syntaxique, connaissance du monde (« la ville » après « Ouagadougou »). Les modèles neuronaux comparent chaque mention aux précédentes et prédisent les liens. Cas difficiles : « Il » ambigu entre deux hommes, langues sans marque de genre sur les pronoms (yoruba, finnois), pronoms omis (espagnol, japonais).", "ex": "« Thomas Sankara est né à Yako. Il est devenu président en 1983. Le capitaine a alors renommé le pays. » → Il = Le capitaine = Thomas Sankara. Trois mentions, une entité.", "pourquoi": "Sans coréférence, un système d'extraction attribue « est devenu président » à personne. C'est aussi la clé du résumé et de la réponse aux questions.", "plus": [["Wikipédia — Coréférence", "https://fr.wikipedia.org/wiki/Coréférence"], ["Jurafsky & Martin, chap. 23 (en)", "https://web.stanford.edu/~jurafsky/slp3/23.pdf"]]}}, {"kicker": "Coréférence", "title": "« Moussa a dit à Issa qu'il avait gagné. » Pourquoi est-ce difficile pour un modèle ?", "intro": "Deux hommes, un pronom.", "options": ["La phrase est trop longue", "« il » peut renvoyer à Moussa ou à Issa : genr   // Accès chapitres de code
  const sec2=document.createElement('div');sec2.className='sec';sec2.textContent='Coder';stage.appendChild(sec2);
  const g=document.createElement('div');g.className='grid2';
  g.appendChild(card('🐍','Python',(P.py||[]).length+'/'+PYUNITS.length+' leçons','linear-gradient(135deg,#3776AB,#FFD343)',pythonHome));
  g.appendChild(card('🧱','POO',(P.poo||[]).length+'/'+POOUNITS.length+' leçons','linear-gradient(135deg,#F43F5E,#8B5CF6)',pooHome));
  stage.appendChild(g);
}
function chapterView(ch){
  d=null;back.style.display='block';back.onclick=parcours;h1.textContent=DOSSIERS[ch].name;dots.innerHTML='';setNav(0);
  const idxs=chIndices(ch),dn=chDone(ch),tot=idxs.length,pct=Math.round(dn/tot*100);
  stage.innerHTML=`<div class="hero"><p class="kicker">${ICONS[ch]} Chapitre ${ch+1}</p><h2>${DOSSIERS[ch].name}</h2><p class="hint">${dn}/${tot} leçons · ${(P.boss||[]).includes(ch)?'boss vaincu 👹':'boss à battre'}</p><div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>`;
  const map=document.createElement('div');map.className='path';const h=document.createElement('div');h.className='chap';h.style.setProperty('--grad',GRADS[ch]);h.innerHTML=`<span>${ICONS[ch]}</span>${DOSSIERS[ch].name}`;map.appendChild(h);
  idxs.forEach(i=>{const u=UNITS[i];const state=i<P.path?'done':i===P.path?'now':'lock';
    const n=document.createElement('button');n.className='node '+state+(u.boss||u.project?' boss':'');n.style.setProperty('--grad',GRADS[ch]);
    n.innerHTML=`<div class="dot">${u.project?PROJECTS[ch].ico:state==='done'?(u.boss?'👹':P.pathPerfect.includes(i)?'⭐':'✅'):state==='now'?(u.boss?'👹':'▶'):'🔒'}</div><div class="nl"><b>${u.project?'Projet : '+PROJECTS[ch].title:u.boss?'Boss du chapitre':u.kicker}</b><span>${u.project?'Un vrai outil, étape par étape':u.boss?'1 question qui mélange tout':u.qs.length+' questions · 3 bouchées'}</span></div>`;
    n.disabled=state==='lock';n.onclick=()=>lesson(i);map.appendChild(n);});
